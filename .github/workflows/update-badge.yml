name: Update official badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Fix badges, timer, levels, sounds, and rounded square
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_b = "const B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/common/champion/badge.webp';"
          new_b = "const BADGE_ASSETS=['accuracy','adventurer','breakthrough','challenger','champion','clear','combo','comeback','connection','courage','creative','curiosity'].map(x=>'https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/badges/common/'+x+'/badge.png');"
          if old_b in s:
              s = s.replace(old_b, new_b)

          old_render = "function renderBadges(){const x=bag();$('#badges').innerHTML=BADGES.map(b=>{const on=!!x[b[0]];return`<div class=\"badge ${on?'earned':'lock'}\"><span class=\"badge-state\">${on?'獲得済み':'未獲得'}</span><img src=\"${B}\" alt=\"${b[1]}\"><h3>${b[3]} ${b[1]}</h3><p>${b[2]}</p></div>`}).join('')}"
          new_render = "function renderBadges(){const x=bag();$('#badges').innerHTML=BADGES.map((b,i)=>{const on=!!x[b[0]];const img=BADGE_ASSETS[i%BADGE_ASSETS.length];return`<div class=\"badge ${on?'earned':'lock'}\"><span class=\"badge-state\">${on?'獲得済み':'未獲得'}</span><img src=\"${img}\" alt=\"${b[1]}\"><h3>${b[3]} ${b[1]}</h3><p>${b[2]}</p></div>`}).join('')}"
          if old_render in s:
              s = s.replace(old_render, new_render)

          old_style = '.level.on{border-color:var(--blue);background:var(--blue2)}'
          new_style = '.level.on{border-color:var(--blue);background:var(--blue2)}.level[data-l="2"].on{border-color:var(--green);background:#eef9f4}.level[data-l="2"].on b{color:var(--green)}.level[data-l="3"].on{border-color:#8b5cf6;background:#f3edff}.level[data-l="3"].on b{color:#7c3aed}'
          if old_style in s and 'level[data-l="2"].on' not in s:
              s = s.replace(old_style, new_style)

          old_levels = "document.querySelector('.levels').onclick=e=>{const b=e.target.closest('.level');if(!b)return;L=+b.dataset.l;renderHome()}"
          new_levels = "document.querySelector('.levels').onclick=e=>{const b=e.target.closest('.level');if(!b)return;L=+b.dataset.l;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('on',+x.dataset.l===L));renderHome()}"
          if old_levels in s:
              s = s.replace(old_levels, new_levels)

          s = s.replace('30.0秒', '60.0秒')
          s = s.replace('30秒で、図形に合う公式をできるだけ正確に選びます。', '60秒で、図形に合う公式をできるだけ正確に選びます。')
          s = s.replace('30秒でどこまで伸ばせるかな？', '60秒でどこまで伸ばせるかな？')
          s = s.replace('(30000-(Date.now()-started))', '(60000-(Date.now()-started))')
          s = s.replace('>=30000', '>=60000')

          # 音声ファイルを確実に読み込む。Web Audio APIは最初のボタン操作時に開始される。
          if 'src="sounds.js"' not in s and "src='sounds.js'" not in s:
              s = s.replace('</head>', '<script src="sounds.js" defer></script></head>')

          # 正方形・長方形の角を少し丸く見せる。立体描画のポリゴンには影響しない。
          rounded_css = '.svgbox svg .solid-base-face,.svgbox svg .solid-top-face{stroke-linejoin:round}'
          if rounded_css not in s:
              s = s.replace('</style>', rounded_css + '</style>')

          p.write_text(s, encoding='utf-8')

          # solid-svg.js: 正方形の四隅を丸めた多角形として描画する。
          q = Path('solid-svg.js')
          z = q.read_text(encoding='utf-8')
          old_square = "case'square':{const s=d.side||5;return[[-s/2,-s/2],[s/2,-s/2],[s/2,s/2],[-s/2,s/2]];}"
          new_square = "case'square':{const s=d.side||5,r=Math.min(s*.16,s*.45),h=s/2;const pts=[];for(let k=0;k<4;k++){const a0=-Math.PI/2+k*Math.PI/2;for(let j=0;j<5;j++){const a=a0+j*Math.PI/8;pts.push([Math.cos(a)*r+(k===0||k===3?-h+r:h-r),Math.sin(a)*r+(k===0||k===1?-h+r:h-r)]);}}return pts;}"
          if old_square in z:
              z = z.replace(old_square, new_square)
          q.write_text(z, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html solid-svg.js
          git diff --cached --quiet || git commit -m 'fix: enable sounds and round square corners'
          git push
