name: Update official badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Replace badge asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp'
          new = 'https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/common/champion/badge.webp'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit badge change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: use distinct badge asset'
          git push
