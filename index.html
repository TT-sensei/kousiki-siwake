<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式仕分けくん</title><link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css"><link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css"><style>
:root{--b:#4f7cff;--ink:#263238;--line:#dce8f5;--bg:#f4f9ff;--g:#18a999;--r:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1050px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.navi{width:68px;height:68px;object-fit:contain}.brand h1{margin:0;font-size:clamp(22px,4vw,32px)}.brand p{margin:2px 0;color:#60758c}.scorebox{font-weight:900}.scorebox span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 12px}.screen{background:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 30px #3c649618}.levels,.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.level,.choice{border:3px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;font-weight:900}.level{min-height:82px;font-size:19px}.level.active{border-color:var(--b);background:#eef4ff}.level small{display:block;font-size:12px;color:#718096}.tabs{display:flex;gap:8px;margin:14px 0}.tabbtn{padding:10px 20px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:900;cursor:pointer}.tabbtn.active{background:var(--b);color:#fff}.panel{display:none}.panel.on{display:block}.card{background:#f7fbff;border-radius:18px;padding:18px}.formula-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.group{border:2px solid var(--line);border-radius:15px;padding:12px}.group h3{margin:0 0 7px}.row{display:flex;justify-content:space-between;border-top:1px solid #e7eef5;padding:8px 0;gap:8px}.eq{font-weight:900;color:#315fd8}.main,.next{border:0;background:var(--b);color:#fff;border-radius:15px;min-height:54px;font-weight:900;cursor:pointer}.main{width:100%;margin-top:14px;font-size:18px}.quiztop{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:none;color:#60758c;font-weight:800;cursor:pointer}.figure{height:300px;border:2px dashed #c9d9ea;border-radius:18px;background:#fbfdff;display:flex;align-items:center;justify-content:center;margin:12px 0}.figure svg{width:min(100%,620px);height:290px}.tags{text-align:center;margin:7px}.tag{display:inline-block;background:#eef4ff;color:#315fd8;border-radius:999px;padding:6px 11px;font-weight:900}.prompt{text-align:center;font-size:21px;font-weight:900}.choices{grid-template-columns:repeat(2,1fr)}.choice{min-height:62px;padding:10px;font-size:16px}.choice.correct{border-color:var(--g);background:#effcf9}.choice.wrong{border-color:var(--r);background:#fff3f3}.feedback{text-align:center;min-height:40px;font-weight:900;padding:7px}.next{display:none;width:220px}.next.show{display:inline-block}.nextwrap{text-align:center}.result{text-align:center}.big{font-size:58px;color:#315fd8;font-weight:1000}.combo{font-size:21px;font-weight:900}.badge{width:105px;opacity:.35}.badge.on{opacity:1}.rank{display:inline-block;padding:7px 16px;border-radius:999px;background:#fff1b8;font-weight:900}@media(max-width:700px){.app{padding:8px}.screen{padding:10px}.levels{gap:6px}.level{font-size:16px}.formula-list,.choices{grid-template-columns:1fr}.brand p{display:none}.navi{width:55px;height:55px}.figure{height:245px}.figure svg{height:235px}.prompt{font-size:18px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><img id="head" class="navi"><div><h1>公式仕分けくん</h1><p>図形を見て、公式をえらぼう！</p></div></div><div class="scorebox"><span id="hs">🏆 ハイスコア 0</span></div></header><main class="screen"><section id="home"><div class="levels"><button class="level active" data-l="1">レベル1<small>基本の平面</small></button><button class="level" data-l="2">レベル2<small>平面＋立体</small></button><button class="level" data-l="3">レベル3<small>ごちゃまぜ＋逆算</small></button></div><div class="tabs"><button id="studyBtn" class="tabbtn active">📖 公式集</button><button id="quizBtn" class="tabbtn">🎯 30秒仕分け</button></div><div id="study" class="panel on"><div class="card"><h2 id="studyTitle"></h2><p id="studyDesc"></p><div id="studyList" class="formula-list"></div><p id="tip"></p></div></div><div id="quizHome" class="panel"><div class="card"><h2 id="title"></h2><p>30秒でできるだけたくさん正解しよう！</p><div id="formula" class="formula-list"></div><button id="start" class="main">🔥 30秒チャレンジ開始</button></div></div></section><section id="quiz" class="panel"><div class="quiztop"><b id="timer">⏱ 30.0秒</b><b id="live">⭐ 0点　🔥 0コンボ</b><button id="homeBtn" class="back">やめる</button></div><div id="figure" class="figure"></div><div id="tags" class="tags"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="nextwrap"><button id="next" class="next">次の問題へ →</button></div></section><section id="result" class="panel result"><img id="resultNavi" class="navi"><h2>チャレンジ終了！</h2><div id="final" class="big">0点</div><div id="rank" class="rank"></div><p id="resultMsg"></p><p>正解 <b id="rc">0</b>　／　まちがい <b id="wc">0</b></p><p class="combo">最大コンボ 🔥 <span id="maxcombo">0</span></p><img id="badge" class="badge"><button id="retry" class="main">もう一度挑戦</button><button id="resultHome" class="back">レベル選択へ</button></section></main></div>
<script>
const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';const B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp';const $=s=>document.querySelector(s);const D={'長方形':'たて × 横','正方形':'一辺 × 一辺','平行四辺形':'底辺 × 高さ','三角形':'底辺 × 高さ ÷ 2','台形':'(上底 ＋ 下底) × 高さ ÷ 2','ひし形':'対角線 × 対角線 ÷ 2','円':'半径 × 半径 × 3.14','円周':'直径 × 3.14','立方体':'一辺 × 一辺 × 一辺','直方体':'たて × 横 × 高さ','角柱':'底面積 × 高さ','円柱':'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};const INFO={1:['基本の平面公式','saku'],2:['平面＋立体公式','kai'],3:['ごちゃまぜ＋逆算','riku']};let L=1,Q=[],cur=null,score=0,combo=0,maxcombo=0,correct=0,wrong=0,started=0,remaining=30000,timerId=null,ended=false;
function show(id){['study','quizHome','quiz','result'].forEach(x=>$('#'+x).classList.remove('on'));$('#'+id).classList.add('on')}function nav(p='waving'){const u=N+INFO[L][1]+'/fullbody/'+p+'.webp';['#head','#resultNavi'].forEach(s=>$(s).src=u)}function key(){return 'kousiki-highscore-'+L}function updateHS(){const h=Number(localStorage.getItem(key())||0);$('#hs').textContent='🏆 ハイスコア '+h}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderStudy(){const names=G[L];$('#studyTitle').textContent='レベル'+L+'：'+INFO[L][0];$('#studyDesc').textContent=L===3?'公式を逆向きに使う問題も入っています。':'まずは公式と「何を求めるか」をセットで覚えよう。';const groups=[['平面図形',['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周']],['立体の体積',['立方体','直方体','角柱','円柱']],['逆算',['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ']]];$('#studyList').innerHTML=groups.map(g=>{const a=g[1].filter(x=>names.includes(x));return a.length?`<div class="group"><h3>${g[0]}</h3>${a.map(x=>`<div class="row"><b>${x}</b><span class="eq">${D[x]}</span></div>`).join('')}</div>`:''}).join('');$('#tip').textContent=L===3?'逆算は、もとの公式から求めたいものを残して考えよう。':L===2?'角柱も円柱も「底面積×高さ」。':'図形名＋求めるものを確認！'}function renderHome(){nav();renderStudy();$('#title').textContent='レベル'+L+'：'+INFO[L][0];$('#formula').innerHTML=G[L].map(x=>`<div class="row"><b>${x}</b><span class="eq">${D[x]}</span></div>`).join('');updateHS()}
function svg(body){return `<svg viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg">${body}</svg>`}function line(x1,y1,x2,y2,t){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#526b80" stroke-width="2"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-7}" text-anchor="middle" font-size="17" font-weight="900">${t}</text>`}function draw(k){let s='';if(k==='長方形')s=`<rect x="120" y="55" width="350" height="150" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${line(120,240,470,240,'8 cm')}${line(90,55,90,205,'5 cm')}`;else if(k==='正方形')s=`<rect x="190" y="35" width="220" height="220" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${line(190,275,410,275,'6 cm')}`;else if(k==='平行四辺形')s=`<polygon points="150,205 440,205 500,65 210,65" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="210" y1="65" x2="210" y2="205" stroke="#4f7cff" stroke-width="3"/>${line(150,240,440,240,'8 cm')}${line(210,140,210,205,'5 cm')}`;else if(k==='三角形'||k==='三角形の高さ')s=`<polygon points="150,220 470,220 310,55" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="310" y1="55" x2="310" y2="220" stroke="#4f7cff" stroke-width="3"/>${line(150,250,470,250,'10 cm')}${line(310,135,310,220,'6 cm')}`;else if(k==='台形')s=`<polygon points="200,60 420,60 500,220 120,220" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${line(200,40,420,40,'6 cm')}${line(120,250,500,250,'10 cm')}${line(180,60,180,220,'5 cm')}`;else if(k==='ひし形')s=`<polygon points="310,40 480,145 310,250 140,145" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${line(180,145,440,145,'8 cm')}${line(310,75,310,215,'6 cm')}`;else if(k==='円'||k==='円周')s=`<circle cx="310" cy="145" r="100" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="310" y1="145" x2="410" y2="145" stroke="#4f7cff" stroke-width="3"/>${line(310,175,410,175,'半径 5 cm')}`;else if(k==='立方体')s=`<path d="M190 85l120-45 120 45-120 45zM190 85v120l120 45V130M430 85v120l-120 45" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${line(190,235,310,280,'5 cm')}`;else if(k==='直方体')s=`<path d="M150 95l180-35 150 55-180 40zM150 95v105l150 55V150M480 115v105l-180 35" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${line(150,225,300,280,'6 cm')}${line(300,150,480,115,'4 cm')}`;else if(k==='角柱')s=`<polygon points="150,90 250,45 350,90 250,135" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><polygon points="150,90 150,205 250,250 250,135" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><polygon points="350,90 350,205 250,250 250,135" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><text x="410" y="150" font-size="24" font-weight="900">角柱</text>`;else if(k==='円柱')s=`<ellipse cx="310" cy="65" rx="115" ry="35" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><path d="M195 65v150M425 65v150" stroke="#36516a" stroke-width="4"/><ellipse cx="310" cy="215" rx="115" ry="35" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>`;else s=`<rect x="160" y="65" width="300" height="160" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>`;return svg(s)}
function question(k){let opts;if(k==='円'||k==='円周'){const others=shuffle(G[L].filter(x=>x!=='円'&&x!=='円周')).slice(0,2);opts=shuffle(['円','円周',...others]);}else{opts=shuffle(G[L]).slice(0,4);if(!opts.includes(k))opts[0]=k;opts=shuffle(opts)}const promptMap={'長方形':'この図形の面積に使う公式は？','正方形':'この図形の面積に使う公式は？','平行四辺形':'この図形の面積に使う公式は？','三角形':'この図形の面積に使う公式は？','台形':'この図形の面積に使う公式は？','ひし形':'この図形の面積に使う公式は？','円':'この図形の面積に使う公式は？','円周':'円周を求める公式は？','立方体':'体積を求める公式は？','直方体':'体積を求める公式は？','角柱':'体積を求める公式は？','円柱':'体積を求める公式は？','三角形の高さ':'三角形の高さを求める公式は？','平行四辺形の高さ':'平行四辺形の高さを求める公式は？','長方形の横':'長方形の横を求める公式は？','直方体の高さ':'直方体の高さを求める公式は？'};return {k,opts,prompt:promptMap[k]||'正しい公式は？'}}
function renderQ(){if(ended)return;cur=question(shuffle(Q)[0]);$('#figure').innerHTML=draw(cur.k);$('#tags').innerHTML=`<span class="tag">図形：${cur.k}</span><span class="tag">求めるもの：${cur.prompt.replace('この図形の','').replace('公式は？','')}</span>`;$('#prompt').textContent=cur.prompt;$('#choices').innerHTML=cur.opts.map(x=>`<button class="choice" data-k="${x}">${D[x]}</button>`).join('');$('#feedback').textContent='';$('#next').classList.remove('show')}
function updateLive(){const sec=Math.max(0,(30000-(Date.now()-started))/1000);$('#timer').textContent='⏱ '+sec.toFixed(1)+'秒';$('#live').textContent='⭐ '+score+'点　🔥 '+combo+'コンボ'}function start(){clearInterval(timerId);score=0;combo=0;maxcombo=0;correct=0;wrong=0;ended=false;started=Date.now();Q=G[L];show('quiz');nav();renderQ();updateLive();timerId=setInterval(()=>{updateLive();if(Date.now()-started>=30000)end()},100)}function answer(btn){if(ended||btn.disabled)return;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const ok=btn.dataset.k===cur.k;if(ok){btn.classList.add('correct');combo++;maxcombo=Math.max(maxcombo,combo);score+=10+Math.min(combo-1,10)*5;correct++;$('#feedback').textContent=combo>=3?'🔥 '+combo+'コンボ！ +'+(10+Math.min(combo-1,10)*5)+'点':'⭕ 正解！ +'+(10+Math.min(combo-1,10)*5)+'点'}else{btn.classList.add('wrong');combo=0;wrong++;document.querySelectorAll('.choice').forEach(x=>{if(x.dataset.k===cur.k)x.classList.add('correct')});$('#feedback').textContent='💡 正解は「'+D[cur.k]+'」';}updateLive();$('#next').classList.add('show');if(Date.now()-started>=30000)end()}function end(){if(ended)return;ended=true;clearInterval(timerId);remaining=0;const old=Number(localStorage.getItem(key())||0);const isNew=score>old;if(isNew)localStorage.setItem(key(),score);$('#final').textContent=score+'点';$('#rank').textContent=score>=150?'🏆 公式マスター':score>=100?'🌟 公式名人':score>=60?'✨ 公式上手':'🌱 まずは挑戦！';$('#resultMsg').textContent=isNew&&score>0?'🎉 ハイスコア更新！':'今回もよくがんばった！';$('#rc').textContent=correct;$('#wc').textContent=wrong;$('#maxcombo').textContent=maxcombo;$('#badge').src=B;$('#badge').classList.toggle('on',score>=100);updateHS();show('result')}
$('.levels').addEventListener('click',e=>{const b=e.target.closest('.level');if(!b)return;L=+b.dataset.l;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===b));renderHome()});$('#studyBtn').onclick=()=>{$('#studyBtn').classList.add('active');$('#quizBtn').classList.remove('active');show('study')};$('#quizBtn').onclick=()=>{$('#quizBtn').classList.add('active');$('#studyBtn').classList.remove('active');show('quizHome')};$('#start').onclick=start;$('#retry').onclick=start;$('#choices').onclick=e=>{const b=e.target.closest('.choice');if(b)answer(b)};$('#next').onclick=renderQ;$('#homeBtn').onclick=()=>{clearInterval(timerId);ended=true;show('quizHome');updateHS()};$('#resultHome').onclick=()=>{show('quizHome');updateHS()};renderHome();
</script></body></html>
