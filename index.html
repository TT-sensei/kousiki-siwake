<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式仕分けくん</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css">
<script src="./solid-svg.js"></script>
<style>
:root{--ink:#263238;--blue:#4f7cff;--line:#dce8f5;--paper:#f4f9ff;--green:#18a999;--yellow:#fff1b8;--coral:#ff8b7b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink)}button{font-family:inherit}.app{max-width:1000px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.navi{width:70px;height:70px;object-fit:contain}.screen{background:#fff;border-radius:22px;padding:18px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.level,.choice,.main,.tabbtn{min-height:58px;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:800;cursor:pointer}.level.active{border-color:var(--blue);background:#eef4ff}.level small{display:block;font-weight:400;color:#718096}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabbtn{min-height:44px;padding:7px 16px}.tabbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.intro{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:#f7fbff;border-radius:18px;padding:18px}.formula{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chip{padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}.main{width:100%;margin-top:14px;background:var(--blue);color:#fff;border:0}.quiz,.result,.formula-page{display:none}.quiz.on,.result.on,.formula-page.on{display:block}.figure{min-height:285px;border:2px dashed #c9d9ea;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:12px 0;background:#fbfdff;overflow:hidden}.figure svg{width:min(100%,500px);height:275px}.prompt{text-align:center;font-size:20px;font-weight:800;margin:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:12px}.choice:disabled{cursor:default}.feedback{text-align:center;min-height:35px;font-weight:800}.badge{width:110px;height:110px;opacity:.3;filter:grayscale(1)}.badge.unlocked{opacity:1;filter:none}.center{text-align:center}.back{border:0;background:none;color:#60758c;margin-top:10px;cursor:pointer}.formula-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formula-group{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fbfdff}.formula-group h3{margin:0 0 9px}.formula-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #e7eef5}.formula-row:first-of-type{border-top:0}.formula-name{font-weight:800}.formula-eq{font-weight:800;color:#315fd8;text-align:right}.tip{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--yellow);font-weight:700}.solid-face,.solid-side-face,.solid-top-face{stroke:#36516a;stroke-width:2.5;stroke-linejoin:round}.solid-edge,.solid-base-edge{stroke:#36516a;stroke-width:2.5;fill:none;stroke-linecap:round}.solid-hidden-edge{stroke:#91a6b8;stroke-dasharray:6 5}.solid-base-face{stroke:#36516a;stroke-width:2.5;fill:#ffd8d2}.solid-layer-line{fill:none;stroke:#526b80;stroke-width:1.6}.solid-dimension{stroke:#526b80;stroke-width:1.8}.solid-height-dimension{stroke:var(--blue);stroke-width:2.2}.solid-dimension-text{font-size:15px;font-weight:800;fill:#263238}.solid-height-text{fill:#315fd8}.solid-base-label{font-size:14px;font-weight:800;fill:#263238}.reverse-note{margin-top:8px;font-size:13px;color:#60758c}@media(max-width:700px){.intro{grid-template-columns:1fr}.levels,.formula,.choices,.formula-list{grid-template-columns:1fr}.tabs{flex-direction:column}.screen{padding:12px}.figure{min-height:245px}.figure svg{height:235px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><img id="head" class="navi" alt="ナビキャラ"><div><h1>公式仕分けくん</h1><div>図形を見て、公式をえらぼう！</div></div></div><b id="count">0 / 10</b></header>
<main class="screen">
<section id="home">
<div class="levels"><button class="level active" data-l="1">レベル1<small>基本の平面</small></button><button class="level" data-l="2">レベル2<small>平面＋立体</small></button><button class="level" data-l="3">レベル3<small>ごちゃまぜ＋逆算</small></button></div>
<div class="tabs"><button id="studyBtn" class="tabbtn active">📖 公式集</button><button id="quizBtn" class="tabbtn">🎯 公式仕分け</button></div>
<div id="study" class="formula-page on"><div class="card"><h2 id="studyTitle"></h2><p id="studyDesc"></p><div id="studyList" class="formula-list"></div><div id="studyTip" class="tip"></div></div></div>
<div id="quizHome" class="intro" style="display:none"><div class="card"><h2 id="title"></h2><p id="desc"></p><div id="formula" class="formula"></div><button id="start" class="main">このレベルをはじめる</button></div><div class="center"><img id="homeNavi" class="navi" style="width:180px;height:180px" alt="ナビキャラ"></div></div>
</section>
<section id="quiz" class="quiz"><div><b id="qn"></b><button id="homeBtn" class="back">レベル選択へ</button></div><div id="figure" class="figure"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="result center"><img id="resultNavi" class="navi" alt="ナビキャラ"><h2 id="resultTitle"></h2><p id="resultText"></p><img id="badge" class="badge" alt="図形バッジ"><button id="retry" class="main">もう一度挑戦</button><button id="resultHome" class="back">レベル選択へ</button></section>
</main></div>
<script type="module">
import{EDU_EVENTS}from'https://tt-sensei.github.io/edu-components/index.js';
const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';
const B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp';
const $=s=>document.querySelector(s);
const D={'長方形':'たて × 横','正方形':'一辺 × 一辺','平行四辺形':'底辺 × 高さ','三角形':'底辺 × 高さ ÷ 2','台形':'(上底 ＋ 下底) × 高さ ÷ 2','ひし形':'対角線 × 対角線 ÷ 2','円':'半径 × 半径 × 3.14','円周':'直径 × 3.14','立方体':'一辺 × 一辺 × 一辺','直方体':'たて × 横 × 高さ','角柱':'底面積 × 高さ','円柱':'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};
const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};
const I={1:['レベル1：基本の平面公式','まずは平面図形の公式を覚えよう。','saku'],2:['レベル2：平面＋立体公式','平面図形に立体の体積公式を加えよう。','kai'],3:['レベル3：ごちゃまぜ＋逆算','公式を逆向きに使う問題にも挑戦。','riku']};
const GROUPS=[['平面図形',['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周']],['立体の体積',['立方体','直方体','角柱','円柱']],['逆算（レベル3）',['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ']]];
let L=1,Q=[],i=0,score=0;
function nav(p){const u=N+I[L][2]+'/fullbody/'+p+'.webp';['#head','#homeNavi','#resultNavi'].forEach(s=>$(s).src=u)}
function renderStudy(){const x=I[L];$('#studyTitle').textContent=x[0]+'：公式集';$('#studyDesc').textContent=x[1];$('#studyList').innerHTML=GROUPS.filter(([,ks])=>L===1?ks.every(k=>G[1].includes(k)):L===2?ks.every(k=>G[2].includes(k)):true).map(([name,ks])=>`<div class="formula-group"><h3>${name}</h3>${ks.filter(k=>G[L].includes(k)).map(k=>`<div class="formula-row"><span class="formula-name">${k}</span><span class="formula-eq">${D[k]}</span></div>`).join('')}</div>`).join('');$('#studyTip').textContent=L===3?'逆算は「もとの公式から、求めたいものだけを残す」と考えよう。':L===2?'立体の体積は「底面積 × 高さ」が基本。角柱も円柱も同じ考え方！':'平面図形は、形を見たら「どの長さを使うか」を確認してから公式を選ぼう。'}
function renderHome(){const x=I[L];$('#title').textContent=x[0];$('#desc').textContent=x[1];$('#formula').innerHTML=G[L].map(k=>`<div class="chip">${k}：${D[k]}</div>`).join('');nav('waving');renderStudy()}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function svgOpen(){return `<svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">`}
function dim(x1,y1,x2,y2,text,cls=''){const mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="solid-dimension ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="solid-dimension-text ${cls?'solid-height-text':''}" x="${mx}" y="${my-7}" text-anchor="middle">${text}</text>`}
function plane(t){let s=svgOpen();if(t==='長方形')s+=`<rect x="95" y="55" width="280" height="135" fill="#dff4ff" stroke="#36516a" stroke-width="4" rx="2"/>${dim(95,220,375,220,'8 cm')}${dim(75,55,75,190,'5 cm')}`;else if(t==='正方形')s+=`<rect x="145" y="35" width="190" height="190" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(145,245,335,245,'6 cm')}`;else if(t==='平行四辺形')s+=`<polygon points="120,55 380,55 335,190 75,190" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(75,220,335,220,'8 cm')}${dim(355,55,310,190,'5 cm','solid-height-dimension')}`;else if(t==='三角形')s+=`<polygon points="75,195 385,195 230,45" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="230" y1="45" x2="230" y2="195" class="solid-height-dimension" stroke-width="2"/><text x="245" y="125" class="solid-dimension-text solid-height-text">5 cm</text>${dim(75,220,385,220,'8 cm')}`;else if(t==='台形')s+=`<polygon points="150,55 310,55 390,195 70,195" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(150,38,310,38,'4 cm')}${dim(70,220,390,220,'9 cm')}${dim(125,55,125,195,'5 cm','solid-height-dimension')}`;else if(t==='ひし形')s+=`<polygon points="230,35 370,140 230,245 90,140" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="90" y1="140" x2="370" y2="140" class="solid-dimension"/><line x1="230" y1="35" x2="230" y2="245" class="solid-dimension"/><text x="230" y="132" class="solid-dimension-text" text-anchor="middle">8 cm</text><text x="245" y="95" class="solid-dimension-text solid-height-text">6 cm</text>`;else if(t==='円')s+=`<circle cx="230" cy="140" r="92" fill="#eadfff" stroke="#36516a" stroke-width="4"/><line x1="230" y1="140" x2="322" y2="140" class="solid-height-dimension"/><text x="276" y="130" class="solid-dimension-text solid-height-text">半径 5 cm</text>`;else s+=`<circle cx="230" cy="140" r="92" fill="#eadfff" stroke="#36516a" stroke-width="4"/><line x1="138" y1="140" x2="322" y2="140" class="solid-dimension"/><text x="230" y="130" class="solid-dimension-text" text-anchor="middle">直径 10 cm</text>`;return s+'</svg>'}
function solid(t){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('solid-question');if(t==='立方体')SolidSVG.renderPrism(svg,{width:500,height:280,shape:'square',dimensions:{side:6},solidHeight:6,color:'#dff4ff',baseColor:'#ffd8d2',dimensionsToShow:[{from:{x:-3,y:0,z:3},to:{x:3,y:0,z:3},text:'6 cm'},{from:{x:3,y:0,z:3},to:{x:3,y:6,z:3},text:'6 cm',role:'height'}]});else if(t==='直方体')SolidSVG.renderPrism(svg,{width:500,height:280,shape:'rectangle',dimensions:{width:8,depth:3},solidHeight:5,color:'#dff4ff',baseColor:'#ffd8d2',dimensionsToShow:[{from:{x:-4,y:0,z:1.5},to:{x:4,y:0,z:1.5},text:'8 cm'},{from:{x:4,y:0,z:1.5},to:{x:4,y:5,z:1.5},text:'5 cm',role:'height'}],internalLines:[{from:{x:-4,y:0,z:-1.5},to:{x:4,y:0,z:-1.5},role:'base'}]});else if(t==='円柱')SolidSVG.renderPrism(svg,{width:500,height:280,shape:'circle',dimensions:{radius:4},solidHeight:10,color:'#dff4ff',baseColor:'#ffd8d2',dimensionsToShow:[{from:{x:-4,y:0,z:0},to:{x:4,y:0,z:0},text:'直径 8 cm'},{from:{x:4,y:0,z:0},to:{x:4,y:10,z:0},text:'10 cm',role:'height'}]});else SolidSVG.renderPrism(svg,{width:500,height:280,shape:'rectangle',dimensions:{width:6,depth:4},solidHeight:8,color:'#dff4ff',baseColor:'#ffd8d2',dimensionsToShow:[{from:{x:-3,y:0,z:2},to:{x:3,y:0,z:2},text:'底面'},{from:{x:3,y:0,z:2},to:{x:3,y:8,z:2},text:'高さ',role:'height'}]});return svg.outerHTML}
function reverse(t){if(t==='三角形の高さ')return `${svgOpen()}<polygon points="75,195 385,195 230,45" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="230" y1="45" x2="230" y2="195" class="solid-height-dimension" stroke-width="3"/><text x="248" y="125" class="solid-dimension-text solid-height-text">高さ ?</text><text x="230" y="225" class="solid-dimension-text" text-anchor="middle">底辺 8 cm・面積 20 cm²</text></svg>`;if(t==='平行四辺形の高さ')return `${svgOpen()}<polygon points="110,55 390,55 345,195 65,195" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="370" y1="55" x2="325" y2="195" class="solid-height-dimension" stroke-width="3"/><text x="335" y="125" class="solid-dimension-text solid-height-text">高さ ?</text><text x="230" y="225" class="solid-dimension-text" text-anchor="middle">底辺 10 cm・面積 50 cm²</text></svg>`;if(t==='長方形の横')return `${svgOpen()}<rect x="115" y="60" width="270" height="130" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="400" y1="60" x2="400" y2="190" class="solid-dimension"/><text x="255" y="220" class="solid-dimension-text" text-anchor="middle">面積 40 cm²・たて 5 cm・横 ?</text></svg>`;return `${svgOpen()}<rect x="120" y="75" width="260" height="115" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><text x="250" y="220" class="solid-dimension-text" text-anchor="middle">体積 120 cm³・たて 4 cm・横 5 cm・高さ ?</text></svg>`}
function figure(t){if(['立方体','直方体','角柱','円柱'].includes(t))return solid(t);if(['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ'].includes(t))return reverse(t);return plane(t)}
function start(){Q=shuffle(G[L]).slice(0,10);i=0;score=0;$('#home').style.display='none';$('#quiz').classList.add('on');$('#result').classList.remove('on');next()}
function next(){if(i>=Q.length)return finish();const k=Q[i];$('#qn').textContent=`第 ${i+1} 問 / 10`;$('#count').textContent=`${i} / 10`;$('#figure').innerHTML=figure(k);$('#prompt').textContent=L===3&&k.includes('の')?`「${k}」を求める公式は？`:`この図形の公式はどれ？`;const wrong=shuffle(G[L].filter(x=>x!==k)).slice(0,3);$('#choices').innerHTML=shuffle([k,...wrong]).map(x=>`<button class="choice" data-k="${x}">${D[x]}</button>`).join('');$('#feedback').textContent='';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,k))}
function answer(btn,k){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const ok=btn.dataset.k===k;if(ok){score++;btn.style.borderColor='#18a999';$('#feedback').textContent='○ 正解！';EDU_EVENTS.dispatchEvent(new CustomEvent(EDU_EVENTS.CORRECT));}else{btn.style.borderColor='#ff6b6b';const c=[...document.querySelectorAll('.choice')].find(b=>b.dataset.k===k);if(c)c.style.borderColor='#18a999';$('#feedback').textContent=`× 正解は「${D[k]}」`;EDU_EVENTS.dispatchEvent(new CustomEvent(EDU_EVENTS.WRONG));}setTimeout(()=>{i++;next()},650)}
function finish(){localStorage.setItem(`kousiki-best-${L}`,Math.max(score,Number(localStorage.getItem(`kousiki-best-${L}`)||0)));$('#count').textContent='10 / 10';$('#quiz').classList.remove('on');$('#result').classList.add('on');$('#resultNavi').src=N+I[L][2]+'/fullbody/celebrate.webp';$('#resultTitle').textContent=score===10?'パーフェクト！':`${score} / 10 正解！`;$('#resultText').textContent=score===10?'公式をしっかり見分けられたね！':`もう一度公式集を見てから挑戦してみよう。ベスト記録：${localStorage.getItem(`kousiki-best-${L}`)} / 10`;$('#badge').src=B;$('#badge').classList.toggle('unlocked',score===10);EDU_EVENTS.dispatchEvent(new CustomEvent(score===10?EDU_EVENTS.BADGE:EDU_EVENTS.COMPLETE))}
function home(){ $('#quiz').classList.remove('on');$('#result').classList.remove('on');$('#home').style.display='block';$('#quizHome').style.display='none';$('#study').classList.add('on');renderHome();$('#count').textContent='0 / 10'}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{L=Number(b.dataset.l);document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderHome()});$('#studyBtn').onclick=()=>{$('#studyBtn').classList.add('active');$('#quizBtn').classList.remove('active');$('#study').classList.add('on');$('#quizHome').style.display='none'};$('#quizBtn').onclick=()=>{$('#quizBtn').classList.add('active');$('#studyBtn').classList.remove('active');$('#study').removeClass?.('on');$('#study').classList.remove('on');$('#quizHome').style.display='grid'};$('#start').onclick=start;$('#homeBtn').onclick=home;$('#retry').onclick=start;$('#resultHome').onclick=home;renderHome();
</script>
</body></html>
