<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公式仕分けくん</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-interaction-kit.css">
<style>
:root{--ink:#263238;--blue:#4f7cff;--paper:#f7fbff;--line:#dce8f5;--ok:#42b883;--bad:#ef6b73;--gold:#f4b942}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(135deg,#eef7ff,#fffdf5);min-height:100vh}
button{font:inherit;touch-action:manipulation}.app{width:min(1180px,100%);margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.brand h1{font-size:clamp(22px,4vw,34px);margin:0}.brand p{margin:2px 0 0;color:#64748b}.navi{width:76px;height:76px;object-fit:contain}.progress{display:flex;align-items:center;gap:8px}.bar{width:130px;height:10px;background:#e7eef6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:.25s}.screen{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 36px #7b8fa522;padding:20px}.level-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.level-tab{min-height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font-weight:800}.level-tab.active{border-color:var(--blue);background:#eef4ff}.level-tab small{display:block;font-weight:500;color:#718096;margin-top:3px}.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center}.intro-card{background:var(--paper);border-radius:20px;padding:22px}.formula-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.formula-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px}.start{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;margin-top:18px}.quiz{display:none}.quiz.on{display:block}.question-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.question-no{font-weight:800;color:#64748b}.figure{height:230px;border:2px dashed #c9d9ea;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#fbfdff;margin:14px 0;overflow:hidden}.figure svg{width:min(330px,75%);height:200px}.figure text{font-family:inherit}.prompt{text-align:center;font-weight:800;font-size:20px;margin:8px 0 14px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:68px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;cursor:pointer;font-weight:700}.choice:hover{border-color:#9ab8df}.choice:disabled{cursor:default}.feedback{text-align:center;min-height:36px;font-weight:800;margin:10px}.result{display:none;text-align:center}.result.on{display:block}.badge{width:104px;height:104px;object-fit:contain;filter:grayscale(1);opacity:.35}.badge.unlocked{filter:none;opacity:1}.badges{display:flex;justify-content:center;gap:14px;margin:14px}.back{border:0;background:transparent;color:#60758c;cursor:pointer;font-weight:700}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:700px){.app{padding:10px}.intro{grid-template-columns:1fr}.intro .navi{width:62px;height:62px}.screen{padding:13px;border-radius:18px}.formula-list{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.figure{height:190px}.level-tab{font-size:14px}.level-tab small{font-size:11px}.top .progress{display:none}}
</style></head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><img class="navi" id="navi" alt="ナビキャラ"><div><h1>公式仕分けくん</h1><p>図形を見て、ぴったりの公式をえらぼう！</p></div></div>
 <div class="progress"><span id="scoreText">0 / 10</span><span class="bar"><i id="progressBar"></i></span></div>
</header>
<main class="screen">
 <section id="home">
  <div class="level-tabs" role="tablist">
   <button class="level-tab active" data-level="1">レベル1<small>基本の平面</small></button>
   <button class="level-tab" data-level="2">レベル2<small>平面＋立体</small></button>
   <button class="level-tab" data-level="3">レベル3<small>ごちゃまぜ＋逆算</small></button>
  </div>
  <div class="intro">
   <div class="intro-card"><h2 id="levelTitle">レベル1：基本の平面公式</h2><p id="levelDesc">まずは、よく使う平面図形の公式を見分けよう。</p><div class="formula-list" id="formulaList"></div><button class="start" id="start">このレベルをはじめる</button></div>
   <div style="text-align:center"><img id="naviHome" class="navi" style="width:180px;height:180px" alt="ナビキャラ"></div>
  </div>
 </section>
 <section id="quiz" class="quiz">
  <div class="question-head"><span class="question-no" id="questionNo">1 / 10</span><button class="back" id="homeBtn">レベル選択へ</button></div>
  <div class="figure" id="figure"></div><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div>
 </section>
 <section id="result" class="result">
  <img class="navi" id="naviResult" style="width:130px;height:130px" alt="ナビキャラ"><h2 id="resultTitle">クリア！</h2><p id="resultText"></p><div class="badges"><img id="badge" class="badge" alt="算数バッジ"></div><button class="start" id="retry">もう一度挑戦</button><button class="back" id="resultHome">レベル選択へ</button>
 </section>
</main></div>
<script type="module">
import { EDU_EVENTS } from 'https://tt-sensei.github.io/edu-components/index.js';

const NAVI='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';
const BADGE='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp';
const levels={
  1:{title:'レベル1：基本の平面公式',desc:'まずは、よく使う平面図形の公式を見分けよう。', formulas:['長方形：たて×横','正方形：一辺×一辺','平行四辺形：底辺×高さ','三角形：底辺×高さ÷2','台形：(上底＋下底)×高さ÷2','ひし形：対角線×対角線÷2','円：半径×半径×3.14','円周：直径×3.14'],types:['rect','square','para','tri','trap','rhombus','circle','circum']},
  2:{title:'レベル2：平面＋立体公式',desc:'平面図形に、立方体・直方体・角柱・円柱を加えよう。',formulas:['長方形：たて×横','正方形：一辺×一辺','平行四辺形：底辺×高さ','三角形：底辺×高さ÷2','台形：(上底＋下底)×高さ÷2','ひし形：対角線×対角線÷2','円：半径×半径×3.14','円周：直径×3.14','立方体：一辺×一辺×一辺','直方体：たて×横×高さ','角柱：底面積×高さ','円柱：底面積×高さ'],types:['rect','square','para','tri','trap','rhombus','circle','circum','cube','cuboid','prism','cylinder']},
  3:{title:'レベル3：ごちゃまぜ＋逆算',desc:'平面・立体をごちゃまぜ。公式を逆向きにも考えよう。',formulas:['面積から高さ：面積×2÷底辺','三角形の底辺：面積×2÷高さ','平行四辺形の高さ：面積÷底辺','円の半径：面積÷3.14を考える','体積から高さ：体積÷底面積','長方形の横：面積÷たて','直方体の高さ：体積÷たて÷横','円柱の高さ：体積÷底面積'],types:['rect','square','para','tri','trap','rhombus','circle','circum','cube','cuboid','prism','cylinder','reverseTri','reversePara','reverseRect','reverseCuboid']}
};
const examples={rect:{label:'長方形',formula:'たて × 横',svg:'<rect x="65" y="55" width="210" height="115" rx="3"/><text x="155" y="195">たて</text><text x="165" y="45">横</text>'},square:{label:'正方形',formula:'一辺 × 一辺',svg:'<rect x="85" y="45" width="160" height="160"/><text x="145" y="225">一辺</text>'},para:{label:'平行四辺形',formula:'底辺 × 高さ',svg:'<path d="M75 180 L270 180 L225 55 L30 55 Z"/><text x="145" y="205">底辺</text><text x="105" y="125">高さ</text>'},tri:{label:'三角形',formula:'底辺 × 高さ ÷ 2',svg:'<path d="M55 180 L275 180 L175 45 Z"/><line x1="175" y1="45" x2="175" y2="180" stroke="#263238" stroke-dasharray="6 5"/><text x="145" y="205">底辺</text><text x="183" y="120">高さ</text>'},trap:{label:'台形',formula:'(上底＋下底) × 高さ ÷ 2',svg:'<path d="M100 55 L245 55 L285 180 L55 180 Z"/><text x="155" y="45">上底</text><text x="145" y="205">下底</text>'},rhombus:{label:'ひし形',formula:'対角線 × 対角線 ÷ 2',svg:'<path d="M175 35 L285 125 L175 215 L65 125 Z"/><line x1="65" y1="125" x2="285" y2="125" stroke="#263238"/><line x1="175" y1="35" x2="175" y2="215" stroke="#263238" stroke-dasharray="6 5"/>'},circle:{label:'円の面積',formula:'半径 × 半径 × 3.14',svg:'<circle cx="175" cy="125" r="85"/><line x1="175" y1="125" x2="260" y2="125" stroke="#263238"/><text x="205" y="115">半径</text>'},circum:{label:'円周',formula:'直径 × 3.14',svg:'<circle cx="175" cy="125" r="85"/><line x1="90" y1="125" x2="260" y2="125" stroke="#263238"/><text x="155" y="115">直径</text>'},cube:{label:'立方体の体積',formula:'一辺 × 一辺 × 一辺',svg:'<path d="M80 85 L180 50 L265 85 L165 120 Z M80 85 L80 185 L165 220 L165 120 M165 220 L265 185 L265 85" fill="none"/>'},cuboid:{label:'直方体の体積',formula:'たて × 横 × 高さ',svg:'<path d="M55 75 L210 75 L275 115 L120 115 Z M55 75 L55 175 L120 215 L120 115 M120 215 L275 175 L275 115" fill="none"/>'},prism:{label:'角柱の体積',formula:'底面積 × 高さ',svg:'<path d="M75 170 L150 55 L225 170 Z M115 185 L190 70 L265 185 Z M75 170 L115 185 M150 55 L190 70 M225 170 L265 185" fill="none"/>'},cylinder:{label:'円柱の体積',formula:'底面積 × 高さ',svg:'<ellipse cx="175" cy="65" rx="90" ry="25"/><line x1="85" y1="65" x2="85" y2="185"/><line x1="265" y1="65" x2="265" y2="185"/><ellipse cx="175" cy="185" rx="90" ry="25"/>'},reverseTri:{label:'三角形の高さ',formula:'面積 × 2 ÷ 底辺',svg:'<path d="M55 180 L275 180 L175 45 Z"/><text x="125" y="145">面積がわかる</text>'},reversePara:{label:'平行四辺形の高さ',formula:'面積 ÷ 底辺',svg:'<path d="M75 180 L270 180 L225 55 L30 55 Z"/><text x="125" y="135">面積がわかる</text>'},reverseRect:{label:'長方形の横',formula:'面積 ÷ たて',svg:'<rect x="65" y="55" width="210" height="115"/><text x="125" y="120">面積がわかる</text>'},reverseCuboid:{label:'直方体の高さ',formula:'体積 ÷ たて ÷ 横',svg:'<path d="M55 75 L210 75 L275 115 L120 115 Z M55 75 L55 175 L120 215 L120 115 M120 215 L275 175 L275 115"/><text x="125" y="145">体積がわかる</text>'}};
const state={level:1,q:0,score:0,questions:[]};
const $=s=>document.querySelector(s); const emit=(name,detail)=>window.dispatchEvent(new CustomEvent(name,{detail}));
function navi(name='saku',pose='waving'){const url=NAVI+name+'/'+pose+'.webp'; ['#navi','#naviHome','#naviResult'].forEach(s=>$(s).src=url)}
function renderLevel(){const l=levels[state.level];$('#levelTitle').textContent=l.title;$('#levelDesc').textContent=l.desc;$('#formulaList').innerHTML=l.formulas.map(x=>`<div class="formula-chip">${x}</div>`).join('');navi(state.level===3?'riku':state.level===2?'kai':'saku','waving')}
function makeQuestions(){let pool=[...levels[state.level].types];const out=[];while(out.length<10){out.push(pool[Math.floor(Math.random()*pool.length)])}return out}
function distractors(correct,type){const all=Object.keys(examples).filter(k=>k!==type).map(k=>examples[k].formula);const set=new Set([correct]);while(set.size<4)set.add(all[Math.floor(Math.random()*all.length)]);return [...set].sort(()=>Math.random()-.5)}
function showQuestion(){const type=state.questions[state.q];const ex=examples[type];$('#questionNo').textContent=`${state.q+1} / 10`;$('#scoreText').textContent=`${state.score} / 10`;$('#progressBar').style.width=`${state.q/10*100}%`;$('#figure').innerHTML=`<svg viewBox="0 0 350 250" fill="none" stroke="#4f7cff" stroke-width="5">${ex.svg}</svg>`;$('#prompt').textContent=`「${ex.label}」の公式はどれ？`;$('#feedback').textContent='';$('#choices').innerHTML='';distractors(ex.formula,type).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(c===ex.formula,b,ex.formula);$('#choices').appendChild(b)})}
function answer(ok,btn,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(ok){state.score++;btn.classList.add('effect-correct-ring');$('#feedback').textContent='○ 正解！';emit(EDU_EVENTS?.CORRECT||'edu:correct',{isCorrect:true,correct,question:state.questions[state.q]});navi(state.level===3?'riku':state.level===2?'kai':'saku','correct')}else{btn.classList.add('effect-wrong-shake');$('#feedback').textContent=`△ 正解は「${correct}」`;emit(EDU_EVENTS?.WRONG||'edu:wrong',{isCorrect:false,correct,question:state.questions[state.q]});navi(state.level===3?'riku':state.level===2?'kai':'saku','hint')};setTimeout(()=>{state.q++;if(state.q>=10)finish();else showQuestion()},750)}
function start(){state.q=0;state.score=0;state.questions=makeQuestions();$('#home').style.display='none';$('#result').classList.remove('on');$('#quiz').classList.add('on');showQuestion();emit(EDU_EVENTS?.SCREEnCHANGE||'edu:screenchange',{to:'quiz'})}
function finish(){ $('#quiz').classList.remove('on');$('#result').classList.add('on');$('#resultText').textContent=`10問中 ${state.score}問正解！`;$('#resultTitle').textContent=state.score>=8?'すばらしい！公式マスター！':state.score>=5?'いい調子！もう一歩！':'公式を見直して、もう一度！';const got=state.score>=8;$('#badge').classList.toggle('unlocked',got);localStorage.setItem('kousiki-siwake-best-'+state.level,Math.max(state.score,+(localStorage.getItem('kousiki-siwake-best-'+state.level)||0)));navi(state.level===3?'riku':state.level===2?'kai':'saku',got?'complete':'encouraging');if(got)emit(EDU_EVENTS?.BADGE||'edu:badge',{badge:{id:'geometry',image:BADGE}});emit(EDU_EVENTS?.COMPLETE||'edu:complete',{type:'quiz',value:state.score})}
function home(){ $('#quiz').classList.remove('on');$('#result').classList.remove('on');$('#home').style.display='block';renderLevel() }
document.querySelectorAll('.level-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.level=+b.dataset.level;renderLevel()});$('#start').onclick=start;$('#retry').onclick=start;$('#homeBtn').onclick=home;$('#resultHome').onclick=home;renderLevel();
</script></body></html>
