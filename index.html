68rem;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f1eee7;padding:4px;border-radius:13px;margin:10px 0}.tab{height:42px;border:0;border-radius:10px;background:transparent;font-weight:900}.tab.on{background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(0,0,0,.06)}.study{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.card{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fcfbf8}.card h3{font-size:1rem;margin:0 0 4px}.card p{font-size:.73rem;color:var(--muted);font-weight:700;margin:0 0 8px}.formulas{display:grid;grid-template-columns:1fr 1fr;gap:7px}.group{background:#fff;border:1px solid #e6e1d8;border-radius:12px;padding:8px}.group h4{font-size:.76rem;margin:0 0 4px}.row{display:flex;justify-content:space-between;gap:6px;border-top:1px solid #eeeae2;padding:5px 0;font-size:.68rem}.row:first-of-type{border-top:0}.eq{color:var(--blue);font-weight:900;text-align:right}.tip{font-size:.75rem;font-weight:800;padding:9px;border-radius:11px;background:#fff5d8;margin-bottom:9px}.points{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.points span{font-size:.63rem;font-weight:900;padding:5px 7px;background:#eeeae2;border-radius:999px}.start{width:100%;height:48px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.challenge{display:flex;align-items:center;justify-content:space-between;gap:15px}.challenge h3{margin:0 0 3px}.challenge p{margin:0;color:var(--muted);font-size:.74rem;font-weight:700}.challenge .start{width:auto;padding:0 18px;white-space:nowrap}.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.badge{position:relative;text-align:center;border:1px solid var(--line);border-radius:13px;padding:8px;background:#fff}.badge img{width:62px;height:62px;object-fit:contain}.badge.lock img{opacity:.18;filter:grayscale(1)}.badge h3{font-size:.7rem;margin:3px 0 0}.badge p{font-size:.58rem;color:var(--muted);margin:2px 0 0;font-weight:700}.badge-state{position:absolute;right:5px;top:5px;font-size:.5rem;padding:3px 5px;border-radius:99px;background:#eeeae2}.badge.earned{border-color:#e4c86a}.badge.earned .badge-state{background:#fff1bd}.quiz{overflow:hidden}.quizbar{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fbfaf7}.qtitle{flex:1;min-width:0}.qtitle b{display:block;font-size:.88rem}.qtitle span{display:block;font-size:.64rem;color:var(--muted);font-weight:700}.live{display:flex;gap:5px}.quit{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:900}.quizbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:10px;padding:10px;height:calc(100dvh - 80px);min-height:430px;max-height:760px}.figure,.answer{border:1px solid var(--line);border-radius:16px;background:#fff;min-width:0;min-height:0}.figure{display:flex;flex-direction:column;background:#fafcfb;overflow:hidden}.figurehead{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);font-size:.65rem;font-weight:900}.tag{padding:4px 7px;border-radius:99px;background:var(--blue2);color:var(--blue)}.svgbox{flex:1;display:flex;align-items:center;justify-content:center;padding:5px;min-height:0}.svgbox svg{width:100%;height:100%;max-height:100%}.answer{display:flex;flex-direction:column;padding:13px;overflow:auto}.label{font-size:.62rem;color:var(--muted);font-weight:900;letter-spacing:.1em}.prompt{font-size:clamp(1rem,2vw,1.35rem);font-weight:900;margin:4px 0 10px;line-height:1.35}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{min-height:58px;padding:8px;border:2px solid #ddd8ce;border-radius:12px;background:#fff;font-size:.75rem;font-weight:900;cursor:pointer}.choice.correct{border-color:var(--green);background:#eef9f4;color:#206e51}.choice.wrong{border-color:var(--red);background:#fff1ed;color:#a3402c}.feedback{margin-top:8p <section id="home" class="screen active"><div class="panel home"><div class="home-title"><h2>まずレベルをえらぼう</h2><p>公式集 → チャレンジ → 結果</p></div><div class="levels"><button class="level on" data-l="1"><b>LEVEL 1</b><span>基本の平面</span><small>面積・円周</small></button><button class="level" data-l="2"><b>LEVEL 2</b><span>平面＋立体</span><small>体積まで</small></button><button class="level" data-l="3"><b>LEVEL 3</b><span>ごちゃまぜ＋逆算</span><small>公式を使いこなす</small></button></div><div class="tabs"><button class="tab on" id="studyTab">📖 公式集</button><button class="tab" id="challengeTab">🎯 チャレンジ</button><button class="tab" id="collectionTab">🏅 コレクション</button></div><div id="studyPanel"><div class="study"><div class="card"><h3 id="studyTitle"></h3><p id="studyDesc"></p><div id="formulas" class="formulas"></div></div><div class="card"><h3>覚えるポイント</h3><div id="tip" class="tip"></div><div class="points"><span>① 図形名</span><span>② 求めるもの</span><span>③ 公式</span></div><button class="start" id="studyStart">このレベルで挑戦 →</button></div></div></div><div id="challengePanel" style="display:none"><div class="card challenge"><div><h3 id="challengeTitle"></h3><p>60秒で、図形に合う公式をできるだけ正確に選びます。</p></div><button class="start" id="start">🔥 スタート</button></div></div><div id="collectionPanel" style="display:none"><div id="badges" class="badges"></div></div></div></section>

<script>
const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';const BADGE_ASSETS=['accuracy','adventurer','breakthrough','challenger','champion','clear','combo','comeback','connection','courage','creative','curiosity'].map(x=>'https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/badges/common/'+x+'/badge.png');const $=s=>document.querySelector(s);const D={'長方形':'たて × 横','正方形':'一辺 × 一辺','平行四辺形':'底辺 × 高さ','三角形':'底辺 × 高さ ÷ 2','台形':'(上底 ＋ 下底) × 高さ ÷ 2','ひし形':'対角線 × 対角線 ÷ 2','円':'半径 × 半径 × 3.14','円周':'直径 × 3.14','立方体':'一辺 × 一辺 × 一辺','直方体':'たて × 横 × 高さ','角柱':'底面積 × 高さ','円柱':'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};const INFO={1:['基本の平面','saku'],2:['平面＋立体','kai'],3:['ごちゃまぜ＋逆算','riku']};const BADGES=[['start','はじめの一歩','1問正解','🌱'],['10','10問クリア','累計10問正解','🔟'],['20','20問クリア','累計20問正解','⭐'],['50','50問クリア','累計50問正解','🌟'],['c3','3コンボ','3コンボ達成','🔥'],['c5','5コンボ','5コンボ達成','💥'],['c10','10コンボ','10コンボ達成','🚀'],['lv1','平面マスター','レベル1で60点以上','📐'],['lv2','立体マスター','レベル2で80点以上','🧊'],['lv3','公式マスター','レベル3で100点以上','👑'],['perfect','ノーミス','1回の挑戦でまちがい0','💎'],['high','記録更新','自己ベストを更新','🏆']];let L=1,cur=null,score=0,combo=0,maxcombo=0,correct=0,wrong=0,started=0,timerId=null,advanceId=null,ended=false,answered=0;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function key(){return'kousiki-highscore-'+L}function nav(p='waving'){const u=N+INFO[L][1]+'/fullbody/'+p+'.webp';$('#head').src=u;$('#resultNavi').src=u}function bag(){try{return JSON.parse(localStorage.getItem('kousiki-badges')||'{}')}catch(e){return{}}}function total(){return+(localStorage.getItem('kousiki-total-correct')||0)}function addCorrect(){localStorage.setItem('kousiki-total-correct',total()+1)}function saveBag(id){const x=bag();x[id]=true;localStorage.setItem('kousiki-badges',JSON.stringify(x))}function unlocked(b){const id=b[0];if(bag()[id])return true;if(id==='start')return total()>=1;if(id==='10')return total()>=10;if(id==='20')return total()>=20;if(id==='50')return total()>=50;if(id==='c3')return maxcombo>=3;if(id==='c5')return maxcombo>=5;if(id==='c10')return maxcombo>=10;if(id==='lv1')return L===1&&score>=60;if(id==='lv2')return L===2&&score>=80;if(id==='lv3')return L===3&&score>=100;if(id==='perfect')return wrong===0&&correct>0;return false}function checkBadges(isNew){const out=[],old=bag();BADGES.forEach(b=>{if(unlocked(b)&&!old[b[0]]){saveBag(b[0]);out.push(b[1])}});if(isNew&&!old.high){saveBag('high');out.push('記録更新')}return out}function renderBadges(){const x=bag();$('#badges').innerHTML=BADGES.map((b,i)=>{const on=!!x[b[0]];const img=BADGE_ASSETS[i%BADGE_ASSETS.length];return`<div class="badge ${on?'earned':'lock'}"><span class="badge-state">${on?'獲得済み':'未獲得'}</span><img src="${img}" alt="${b[1]}"><h3>${b[3]} ${b[1]}</h3><p>${b[2]}</p></div>`}).join('')}function showPanel(id){['studyPanel','challengePanel','collectionPanel'].forEach(x=>$('#'+x).style.display=x===id?'block':'none');$('#studyTab').classList.toggle('on',id==='studyPanel');$('#challengeTab').classList.toggle('on',id==='challengePanel');$('#collectionTab').classList.toggle('on',id==='collectionPanel')}function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function renderStudy(){const names=G[L];$('#studyTitle').textContent='レベル'+L+'：'+INFO[L][0];$('#studyDesc').textContent=L===3?'逆算も入ります。':'図形名 → 求めるもの → 公式の順で確認しよう。';const groups=[['平面図形',['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周']],['立体',['立方体','直方体','角柱','円柱']],['逆算',['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ']]];$('#formulas').innerHTML=groups.map(g=>{const a=g[1].filter(x=>names.includes(x));return a.length?`<div class="group"><h4>${g[0]}</h4>${a.map(x=>`<div class="row"><b>${x}</b><span class="eq">${D[x]}</span></div>`).join('')}</div>`:''}).join('');$('#tip').textContent=L===3?'もとの公式から、求めたいものを残して考えよう。':L===2?'角柱・円柱は「底面積 × 高さ」。':'図形の名前と、何を求めるかをセットで見よう。'}function renderHome(){nav();renderStudy();$('#challengeTitle').textContent='レベル'+L+'：'+INFO[L][0];$('#hs').textContent='🏆 '+(localStorage.getItem(key())||0)+'点';renderBadges()}function draw(k){const t=x=>`<text x="310" y="275" text-anchor="middle" font-size="18" font-weight="900">${x}</text>`;let s='';if(k==='長方形')s='<rect x="100" y="55" width="420" height="170" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('たて 5 cm　×　横 8 cm');else if(k==='正方形')s='<rect x="170" y="30" width="280" height="280" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('一辺 6 cm');else if(k==='平行四辺形')s='<polygon points="130,220 480,220 540,55 190,55" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/><line x1="190" y1="55" x2="190" y2="220" stroke="#2762d4" stroke-width="3"/>'+t('底辺 8 cm　高さ 5 cm');else if(k==='三角形'||k==='三角形の高さ')s='<polygon points="120,220 500,220 310,45" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/><line x1="310" y1="45" x2="310" y2="220" stroke="#2762d4" stroke-width="3"/>'+t('底辺 10 cm　高さ 6 cm');else if(k==='台形')s='<polygon points="200,55 420,55 500,220 120,220" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('上底 6 cm　下底 10 cm　高さ 5 cm');else if(k==='ひし形')s='<polygon points="310,35 500,145 310,255 120,145" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/><line x1="120" y1="145" x2="500" y2="145" stroke="#2762d4" stroke-width="3"/><line x1="310" y1="35" x2="310" y2="255" stroke="#2762d4" stroke-width="3"/>'+t('対角線 8 cm・6 cm');else if(k==='円'||k==='円周')s='<circle cx="310" cy="140" r="105" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/><line x1="310" y1="140" x2="415" y2="140" stroke="#2762d4" stroke-width="3"/>'+t('半径 5 cm');else if(k==='立方体')s='<path d="M170 85l120-45 120 45-120 45zM170 85v120l120 45V130M410 85v120l-120 45" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('一辺 5 cm');else if(k==='直方体')s='<path d="M120 90l190-40 190 65-190 40zM120 90v120l190 65V155M500 115v120l-190 40" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('たて・横・高さ');else if(k==='角柱')s='<polygon points="160,80 260,40 360,80 260,120" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/><path d="M160 80v130l100 45V120M360 80v130l-100 45" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('角柱');else if(k==='円柱')s='<ellipse cx="310" cy="55" rx="120" ry="35" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/><path d="M190 55v165M430 55v165" stroke="#36516a" stroke-width="4"/><ellipse cx="310" cy="220" rx="120" ry="35" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t('底面積 × 高さ');else s='<rect x="130" y="55" width="360" height="170" fill="#e5f2fb" stroke="#36516a" stroke-width="4"/>'+t(k);return`<svg viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg">${s}</svg>`}const P={'長方形':'この図形の面積に使う公式は？','正方形':'この図形の面積に使う公式は？','平行四辺形':'この図形の面積に使う公式は？','三角形':'この図形の面積に使う公式は？','台形':'この図形の面積に使う公式は？','ひし形':'この図形の面積に使う公式は？','円':'この図形の面積に使う公式は？','円周':'円周を求める公式は？','立方体':'体積を求める公式は？','直方体':'体積を求める公式は？','角柱':'体積を求める公式は？','円柱':'体積を求める公式は？','三角形の高さ':'三角形の高さを求める公式は？','平行四辺形の高さ':'平行四辺形の高さを求める公式は？','長方形の横':'長方形の横を求める公式は？','直方体の高さ':'直方体の高さを求める公式は？'};function question(){const k=shuffle(G[L])[0];let opts;if(k==='円'||k==='円周'){opts=shuffle([k,k==='円'?'円周':'円',...shuffle(G[L].filter(x=>x!==k&&x!=='円'&&x!=='円周')).slice(0,2)])}else{opts=shuffle(G[L]).slice(0,4);if(!opts.includes(k))opts[0]=k;opts=shuffle(opts)}return{k,opts,prompt:P[k]}}function renderQ(){if(ended)return;clearTimeout(advanceId);cur=question();answered++;$('#svgbox').innerHTML=draw(cur.k);$('#tag').textContent='図形：'+cur.k;$('#progress').textContent=answered+'問目';$('#prompt').textContent=cur.prompt;$('#choices').innerHTML=cur.opts.map(x=>`<button class="choice" data-k="${x}">${D[x]}</button>`).join('');$('#feedback').textContent='公式をえらんでね。';$('#feedback').className='feedback'}function updateLive(){const sec=Math.max(0,(60000-(Date.now()-started))/1000);$('#timer').textContent='⏱ '+sec.toFixed(1)+'秒';$('#live').textContent='⭐ '+score+'点'}function openModal(){const m=$('#modal');$('#modalTitle').textContent='レベル'+L+'に挑戦';$('#modalText').innerHTML='図形を見て、正しい公式を選びます。<br>60秒でどこまで伸ばせるかな？';$('#modalStart').style.display='block';$('#modalClose').textContent='もどる';m.classList.add('open')}function closeModal(){ $('#modal').classList.remove('open')}function start(){closeModal();score=combo=maxcombo=correct=wrong=answered=0;ended=false;started=Date.now();screen('#quiz');nav();$('#qlevel').textContent='レベル'+L+'：'+INFO[L][0];renderQ();updateLive();clearInterval(timerId);timerId=setInterval(()=>{updateLive();if(Date.now()-started>=60000)end()},100)}function celebrate(){const f=$('#fx');f.innerHTML='<div class="fxring"></div><div class="fxstars">✦ ✦ ✦</div><div class="fxword">正解！</div>';setTimeout(()=>f.innerHTML='',600)}function answer(btn){if(ended||btn.disabled)return;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const ok=btn.dataset.k===cur.k;if(ok){btn.classList.add('correct');combo++;maxcombo=Math.max(maxcombo,combo);const g=10+Math.min(combo-1,10)*5;score+=g;correct++;addCorrect();$('#feedback').textContent=(combo>=3?'🔥 '+combo+'コンボ！ ':'')+'正解！ +'+g+'点';$('#feedback').className='feedback good';celebrate()}else{btn.classList.add('wrong');combo=0;wrong++;document.querySelectorAll('.choice').forEach(x=>{if(x.dataset.k===cur.k)x.classList.add('correct')});$('#feedback').textContent='💡 正解は「'+D[cur.k]+'」';$('#feedback').className='feedback bad'}updateLive();advanceId=setTimeout(()=>{if(Date.now()-started>=60000)end();else renderQ()},ok?180:420)}function end(){if(ended)return;ended=true;clearInterval(timerId);clearTimeout(advanceId);const old=+(localStorage.getItem(key())||0),isNew=score>old;if(isNew)localStorage.setItem(key(),score);$('#score').textContent=score+'点';$('#rank').textContent=score>=150?'🏆 公式マスター':score>=100?'🌟 公式名人':score>=60?'✨ 公式上手':'🌱 まずは挑戦！';$('#resultmsg').textContent=isNew&&score>0?'🎉 ハイスコア更新！':'今回もよくがんばった！';$('#rc').textContent=correct;$('#wc').textContent=wrong;$('#mc').textContent=maxcombo;const unlocks=checkBadges(isNew);renderBadges();screen('#result');if(unlocks.length){setTimeout(()=>{$('#modalTitle').textContent='🏅 バッジGET！';$('#modalText').innerHTML='「'+unlocks.join('」「')+'」を獲得しました。';$('#modalStart').style.display='none';$('#modalClose').textContent='コレクションを見る';$('#modal').classList.add('open');$('#modal').dataset.badge='1'},350)}}document.querySelector('.levels').onclick=e=>{const b=e.target.closest('.level');if(!b)return;L=+b.dataset.l;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('on',+x.dataset.l===L));renderHome()};$('#studyTab').onclick=()=>showPanel('studyPanel');$('#challengeTab').onclick=()=>showPanel('challengePanel');$('#collectionTab').onclick=()=>{renderBadges();showPanel('collectionPanel')};$('#studyStart').onclick=openModal;$('#start').onclick=openModal;$('#modalStart').onclick=start;$('#modalClose').onclick=()=>{if($('#modal').dataset.badge){delete $('#modal').dataset.badge;closeModal();screen('#home');renderHome();showPanel('collectionPanel')}else closeModal()};$('#quit').onclick=()=>{clearInterval(timerId);clearTimeout(advanceId);ended=true;screen('#home');renderHome()};$('#retry').onclick=()=>{screen('#home');showPanel('challengePanel');openModal()};$('#resultHome').onclick=()=>{screen('#home');renderHome()};$('#choices').onclick=e=>{const b=e.target.closest('.choice');if(b)answer(b)};$('#fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};renderHome();
</script></body></html>
