<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式仕分けくん</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css">
<style>
:root{--ink:#263238;--blue:#4f7cff;--blue2:#315fd8;--line:#dce8f5;--paper:#f4f9ff;--green:#18a999;--red:#ff6b6b;--yellow:#fff1b8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink)}button{font-family:inherit}.app{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:clamp(22px,4vw,32px)}.brand p{margin:2px 0 0;color:#60758c}.navi{width:70px;height:70px;object-fit:contain}.screen{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(60,100,150,.08)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.level{min-height:92px;border:3px solid var(--line);border-radius:18px;background:#fff;font-weight:900;font-size:20px;cursor:pointer;padding:12px;transition:.15s}.level:hover{transform:translateY(-2px);border-color:#b9cef5}.level.active{border-color:var(--blue);background:#eef4ff;box-shadow:0 4px 12px rgba(79,124,255,.15)}.level small{display:block;font-size:14px;font-weight:600;color:#718096;margin-top:5px}
.tabs{display:flex;gap:10px;margin-bottom:16px}.tabbtn{min-height:52px;padding:10px 22px;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:900;font-size:17px;cursor:pointer;pointer-events:auto;position:relative;z-index:5}.tabbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{display:none}.panel.on{display:block}.card{background:#f7fbff;border-radius:18px;padding:20px}.intro{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.formula{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.chip{padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}.main{width:100%;margin-top:16px;min-height:58px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.main:hover{filter:brightness(.96)}
.formula-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formula-group{border:2px solid var(--line);border-radius:16px;padding:15px;background:#fbfdff}.formula-group h3{margin:0 0 8px;font-size:18px}.formula-row{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:10px 0;border-top:1px solid #e7eef5}.formula-row:first-of-type{border-top:0}.formula-name{font-weight:900}.formula-eq{font-weight:800;color:var(--blue2);text-align:right}.tip{margin-top:14px;padding:13px 15px;border-radius:14px;background:var(--yellow);font-weight:700}
.quiz-top{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:none;color:#60758c;font-weight:800;cursor:pointer}.figure{min-height:330px;border:2px dashed #c9d9ea;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:14px 0 10px;background:#fbfdff;overflow:hidden}.figure svg{width:min(100%,620px);height:315px}.figure-caption{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tag{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:#eef4ff;color:#315fd8;font-weight:900}.prompt{text-align:center;font-size:21px;font-weight:900;margin:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:70px;padding:12px;border:3px solid var(--line);border-radius:16px;background:#fff;font-size:17px;font-weight:900;cursor:pointer}.choice:hover:not(:disabled){border-color:#a9c3f4;background:#f7faff}.choice:disabled{cursor:default}.choice.correct{border-color:var(--green);background:#effcf9}.choice.wrong{border-color:var(--red);background:#fff3f3}.feedback{text-align:center;min-height:42px;padding:8px;font-weight:900;font-size:18px}.next-wrap{text-align:center;min-height:60px}.next-btn{display:none;min-width:220px;min-height:52px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.next-btn.show{display:inline-block}
.result{text-align:center}.result .navi{width:130px;height:130px}.badge{width:110px;height:110px;opacity:.3;filter:grayscale(1)}.badge.unlocked{opacity:1;filter:none}.result button{display:block}.result .main{max-width:600px;margin:14px auto 0}.result .back{margin:8px auto}.reverse-note{margin-top:8px;font-size:13px;color:#60758c}.solid-face{stroke:#36516a;stroke-width:3;stroke-linejoin:round}.solid-edge{stroke:#36516a;stroke-width:3;fill:none}.solid-hidden{stroke:#91a6b8;stroke-width:2;stroke-dasharray:6 5;fill:none}.dim{stroke:#526b80;stroke-width:2}.dimh{stroke:var(--blue);stroke-width:2.5}.dimtext{font-size:17px;font-weight:900;fill:#263238}.dimhtext{fill:var(--blue2)}
@media(max-width:700px){.app{padding:9px}.screen{padding:12px;border-radius:18px}.levels{gap:7px}.level{min-height:82px;font-size:17px;padding:8px}.level small{font-size:12px}.tabs{gap:6px}.tabbtn{flex:1;padding:8px 6px;font-size:15px}.intro{grid-template-columns:1fr}.formula,.formula-list,.choices{grid-template-columns:1fr}.figure{min-height:260px}.figure svg{height:250px}.prompt{font-size:18px}.choice{min-height:62px}.brand p{display:none}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><img id="head" class="navi" alt="ナビキャラ"><div><h1>公式仕分けくん</h1><p>図形を見て、公式をえらぼう！</p></div></div><b id="count">0 / 10</b></header>
<main class="screen"><section id="home"><div class="levels"><button class="level active" data-l="1">レベル1<small>基本の平面</small></button><button class="level" data-l="2">レベル2<small>平面 ＋ 立体</small></button><button class="level" data-l="3">レベル3<small>ごちゃまぜ ＋ 逆算</small></button></div><div class="tabs"><button id="studyBtn" type="button" class="tabbtn active">📖 公式集</button><button id="quizBtn" type="button" class="tabbtn">🎯 公式仕分け</button></div><div id="study" class="panel on"><div class="card"><h2 id="studyTitle"></h2><p id="studyDesc"></p><div id="studyList" class="formula-list"></div><div id="studyTip" class="tip"></div></div></div><div id="quizHome" class="panel"><div class="intro"><div class="card"><h2 id="title"></h2><p id="desc"></p><div id="formula" class="formula"></div><button id="start" class="main" type="button">このレベルをはじめる</button></div><div style="text-align:center"><img id="homeNavi" class="navi" style="width:200px;height:200px" alt="ナビキャラ"></div></div></div></section><section id="quiz" class="panel"><div class="quiz-top"><b id="qn"></b><button id="homeBtn" class="back" type="button">レベル選択へ</button></div><div id="figure" class="figure"></div><div id="figureCaption" class="figure-caption"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="next-wrap"><button id="nextBtn" class="next-btn" type="button">次の問題へ →</button></div></section><section id="result" class="panel result"><img id="resultNavi" class="navi" alt="ナビキャラ"><h2 id="resultTitle"></h2><p id="resultText"></p><img id="badge" class="badge" alt="図形バッジ"><button id="retry" class="main" type="button">もう一度挑戦</button><button id="resultHome" class="back" type="button">レベル選択へ</button></section></main></div>
<script>
const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';const B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp';const $=s=>document.querySelector(s);
const D={'長方形':'たて × 横','正方形':'一辺 × 一辺','平行四辺形':'底辺 × 高さ','三角形':'底辺 × 高さ ÷ 2','台形':'(上底 ＋ 下底) × 高さ ÷ 2','ひし形':'対角線 × 対角線 ÷ 2','円':'半径 × 半径 × 3.14','円周':'直径 × 3.14','立方体':'一辺 × 一辺 × 一辺','直方体':'たて × 横 × 高さ','角柱':'底面積 × 高さ','円柱':'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};
const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};
const INFO={1:['レベル1：基本の平面公式','まずは平面図形の公式を覚えよう。','saku'],2:['レベル2：平面＋立体公式','平面図形に立体の体積公式を加えよう。','kai'],3:['レベル3：ごちゃまぜ＋逆算','公式を逆向きに使う問題にも挑戦。','riku']};
const GROUPS=[['平面図形',['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周']],['立体の体積',['立方体','直方体','角柱','円柱']],['逆算（レベル3）',['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ']]];
let L=1,Q=[],i=0,score=0,answered=false;
function nav(p){const u=N+INFO[L][2]+'/fullbody/'+p+'.webp';['#head','#homeNavi'].forEach(s=>{const e=$(s);if(e)e.src=u})}
function renderStudy(){const x=INFO[L];$('#studyTitle').textContent=x[0]+'：公式集';$('#studyDesc').textContent=x[1];$('#studyList').innerHTML=GROUPS.map(([name,ks])=>{const list=ks.filter(k=>G[L].includes(k));if(!list.length)return '';return `<div class="formula-group"><h3>${name}</h3>${list.map(k=>`<div class="formula-row"><span class="formula-name">${k}</span><span class="formula-eq">${D[k]}</span></div>`).join('')}</div>`}).join('');$('#studyTip').textContent=L===3?'逆算は「もとの公式から、求めたいものだけを残す」と考えよう。':L===2?'立体の体積は「底面積 × 高さ」が基本。角柱も円柱も同じ考え方！':'図形の名前と、求めるもの（面積・円周・体積など）をセットで覚えよう。'}
function renderHome(){const x=INFO[L];$('#title').textContent=x[0];$('#desc').textContent=x[1];$('#formula').innerHTML=G[L].map(k=>`<div class="chip"><b>${k}</b><br>${D[k]}</div>`).join('');nav('waving');renderStudy()}
function showPanel(id){['study','quizHome','quiz','result'].forEach(x=>$('#'+x).classList.remove('on'));$('#'+id).classList.add('on')}
function selectTab(tab){if(tab==='quiz'){showPanel('quizHome');$('#studyBtn').classList.remove('active');$('#quizBtn').classList.add('active')}else{showPanel('study');$('#quizBtn').classList.remove('active');$('#studyBtn').classList.add('active')}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function svgWrap(body){return `<svg viewBox="0 0 620 315" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`}
function dim(x1,y1,x2,y2,text,cls=''){const mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="${cls==='h'?'dimh':'dim'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="${cls==='h'?'dimtext dimhtext':'dimtext'}" x="${mx}" y="${my-8}" text-anchor="middle">${text}</text>`}
function plane(t){let s='';if(t==='長方形')s=`<rect x="120" y="60" width="350" height="160" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(120,255,470,255,'8 cm')}${dim(95,60,95,220,'5 cm')}`;else if(t==='正方形')s=`<rect x="180" y="40" width="220" height="220" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(180,285,400,285,'6 cm')}`;else if(t==='平行四辺形')s=`<polygon points="150,65 500,65 445,220 95,220" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="95" y1="220" x2="95" y2="65" class="dimh"/><text x="70" y="145" class="dimtext dimhtext" text-anchor="middle">高さ 5 cm</text>${dim(95,255,445,255,'8 cm')}`;else if(t==='三角形')s=`<polygon points="95,225 505,225 300,65" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="300" y1="65" x2="300" y2="225" class="dimh"/><text x="320" y="150" class="dimtext dimhtext">高さ 5 cm</text>${dim(95,260,505,260,'8 cm')}`;else if(t==='台形')s=`<polygon points="170,65 450,65 510,225 110,225" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(170,45,450,45,'上底 5 cm')}${dim(110,260,510,260,'下底 9 cm')}${dim(85,65,85,225,'高さ 4 cm')}`;else if(t==='ひし形')s=`<polygon points="300,45 490,155 300,265 110,155" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(110,155,490,155,'対角線 8 cm')}${dim(300,45,300,265,'対角線 5 cm')}`;else if(t==='円')s=`<circle cx="300" cy="155" r="105" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="300" y1="155" x2="405" y2="155" class="dimh"/><text x="350" y="145" class="dimtext dimhtext">半径 4 cm</text>`;else if(t==='円周')s=`<circle cx="300" cy="155" r="105" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="195" y1="155" x2="405" y2="155" class="dimh"/><text x="300" y="145" class="dimtext dimhtext" text-anchor="middle">直径 8 cm</text>`;return svgWrap(s)}
function solid(t){if(t==='立方体')return svgWrap(`<polygon class="solid-face" fill="#dff4ff" points="190,90 400,90 480,150 270,150"/><polygon class="solid-face" fill="#c9edff" points="190,90 270,150 270,265 190,205"/><polygon class="solid-face" fill="#b7e7fa" points="270,150 480,150 480,265 270,265"/>${dim(190,225,270,285,'5 cm')}`);if(t==='直方体')return svgWrap(`<polygon class="solid-face" fill="#dff4ff" points="150,90 390,90 480,145 240,145"/><polygon class="solid-face" fill="#c9edff" points="150,90 240,145 240,255 150,200"/><polygon class="solid-face" fill="#b7e7fa" points="240,145 480,145 480,255 240,255"/>${dim(150,220,240,275,'たて 4 cm')}${dim(240,275,480,275,'横 6 cm')}${dim(510,145,510,255,'高さ 3 cm')}`);if(t==='角柱')return svgWrap(`<polygon class="solid-face" fill="#dff4ff" points="150,210 300,120 450,210"/><polygon class="solid-face" fill="#c9edff" points="150,210 300,285 450,210 450,120 300,45 150,120"/><polygon class="solid-face" fill="#b7e7fa" points="150,120 300,45 450,120 300,195"/><text x="300" y="175" class="dimtext" text-anchor="middle">角柱</text>${dim(480,120,480,210,'高さ 6 cm')}`);return svgWrap(`<ellipse cx="300" cy="70" rx="105" ry="32" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><path d="M195 70v160M405 70v160" class="solid-edge"/><ellipse cx="300" cy="230" rx="105" ry="32" fill="#b7e7fa" stroke="#36516a" stroke-width="4"/>${dim(435,70,435,230,'高さ 7 cm')}<text x="300" y="158" class="dimtext" text-anchor="middle">円柱</text>`)}
function label(t){return t.replace('の高さ','').replace('の横','')}
function concept(t){if(t.includes('高さ'))return '高さ';if(t.includes('横'))return '横';return '公式'}
function draw(t){if(['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'].includes(t))return plane(t);return solid(t)}
function question(k){const reverse=k.includes('の高さ')||k.includes('の横');let correct=D[k];let pool=Object.values(D).filter(x=>x!==correct);let choices=shuffle([correct,...shuffle(pool).slice(0,3)]);$('#qn').textContent=`第 ${i+1} 問 / 10`;$('#count').textContent=`${i+1} / 10`;$('#figure').innerHTML=draw(label(k));$('#figureCaption').innerHTML=`<span class="tag">図形：${label(k)}</span><span class="tag">求めるもの：${concept(k)}</span>`;$('#prompt').textContent=reverse?`${label(k)}の${concept(k)}を求める公式はどれ？`:`${k}の公式はどれ？`;$('#choices').innerHTML=choices.map(c=>`<button class="choice" type="button">${c}</button>`).join('');$('#feedback').textContent='';$('#nextBtn').classList.remove('show');answered=false;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,correct))}
function answer(btn,correct){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(btn.textContent===correct){btn.classList.add('correct');score++;$('#feedback').textContent='⭕ 正解！'}else{btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('#feedback').textContent='💡 正解は「'+correct+'」'}$('#nextBtn').classList.add('show')}
function nextQuestion(){if(i>=10){finish();return}question(Q[i])}
function start(){Q=shuffle(G[L]);while(Q.length<10)Q.push(...shuffle(G[L]));Q=Q.slice(0,10);i=0;score=0;showPanel('quiz');nextQuestion()}
function finish(){const best=Number(localStorage.getItem('kousiki-best-'+L)||0);if(score>best)localStorage.setItem('kousiki-best-'+L,score);$('#count').textContent=`${score} / 10`;$('#resultTitle').textContent=score===10?'🎉 パーフェクト！':'よくがんばった！';$('#resultText').textContent=`10問中 ${score}問 正解。${score>=8?'公式がかなり身についているね！':'公式集でもう一度確認してみよう。'}`;$('#resultNavi').src=N+INFO[L][2]+'/fullbody/celebrate.webp';$('#badge').src=B;$('#badge').classList.toggle('unlocked',score>=8);showPanel('result')}
function goHome(){showPanel('quizHome');selectTab('quiz')}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{L=Number(b.dataset.l);document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderHome();selectTab('study')});$('#studyBtn').onclick=()=>selectTab('study');$('#quizBtn').onclick=()=>selectTab('quiz');$('#start').onclick=start;$('#nextBtn').onclick=()=>{i++;nextQuestion()};$('#homeBtn').onclick=goHome;$('#retry').onclick=start;$('#resultHome').onclick=goHome;renderHome();selectTab('study');
</script></body></html>
