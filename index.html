<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式仕分けくん</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css">
<style>
:root{--ink:#263238;--blue:#4f7cff;--blue2:#315fd8;--line:#dce8f5;--paper:#f4f9ff;--green:#18a999;--red:#ff6b6b;--yellow:#fff1b8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink)}button{font-family:inherit}.app{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:clamp(22px,4vw,32px)}.brand p{margin:2px 0 0;color:#60758c}.navi{width:70px;height:70px;object-fit:contain}.screen{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(60,100,150,.08)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.level{min-height:92px;border:3px solid var(--line);border-radius:18px;background:#fff;font-weight:900;font-size:20px;cursor:pointer;padding:12px;transition:.15s}.level:hover{transform:translateY(-2px);border-color:#b9cef5}.level.active{border-color:var(--blue);background:#eef4ff;box-shadow:0 4px 12px rgba(79,124,255,.15)}.level small{display:block;font-size:14px;font-weight:600;color:#718096;margin-top:5px}
.tabs{display:flex;gap:10px;margin-bottom:16px}.tabbtn{min-height:52px;padding:10px 22px;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:900;font-size:17px;cursor:pointer}.tabbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{display:none}.panel.on{display:block}.card{background:#f7fbff;border-radius:18px;padding:20px}.intro{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.formula{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.chip{padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}.main{width:100%;margin-top:16px;min-height:58px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.main:hover{filter:brightness(.96)}
.formula-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formula-group{border:2px solid var(--line);border-radius:16px;padding:15px;background:#fbfdff}.formula-group h3{margin:0 0 8px;font-size:18px}.formula-row{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:10px 0;border-top:1px solid #e7eef5}.formula-row:first-of-type{border-top:0}.formula-name{font-weight:900}.formula-eq{font-weight:800;color:var(--blue2);text-align:right}.tip{margin-top:14px;padding:13px 15px;border-radius:14px;background:var(--yellow);font-weight:700}
.quiz-top{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:none;color:#60758c;font-weight:800;cursor:pointer}.figure{min-height:330px;border:2px dashed #c9d9ea;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:14px 0 10px;background:#fbfdff;overflow:hidden}.figure svg{width:min(100%,620px);height:315px}.figure-caption{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tag{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:#eef4ff;color:#315fd8;font-weight:900}.prompt{text-align:center;font-size:21px;font-weight:900;margin:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:70px;padding:12px;border:3px solid var(--line);border-radius:16px;background:#fff;font-size:17px;font-weight:900;cursor:pointer}.choice:hover:not(:disabled){border-color:#a9c3f4;background:#f7faff}.choice:disabled{cursor:default}.choice.correct{border-color:var(--green);background:#effcf9}.choice.wrong{border-color:var(--red);background:#fff3f3}.feedback{text-align:center;min-height:42px;padding:8px;font-weight:900;font-size:18px}.next-wrap{text-align:center;min-height:60px}.next-btn{display:none;min-width:220px;min-height:52px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.next-btn.show{display:inline-block}
.result{text-align:center}.result .navi{width:130px;height:130px}.badge{width:110px;height:110px;opacity:.3;filter:grayscale(1)}.badge.unlocked{opacity:1;filter:none}.result button{display:block}.result .main{max-width:600px;margin:14px auto 0}.result .back{margin:8px auto}
.reverse-note{margin-top:8px;font-size:13px;color:#60758c}.solid-face{stroke:#36516a;stroke-width:3;stroke-linejoin:round}.solid-edge{stroke:#36516a;stroke-width:3;fill:none}.solid-hidden{stroke:#91a6b8;stroke-width:2;stroke-dasharray:6 5;fill:none}.dim{stroke:#526b80;stroke-width:2}.dimh{stroke:var(--blue);stroke-width:2.5}.dimtext{font-size:17px;font-weight:900;fill:#263238}.dimhtext{fill:var(--blue2)}
@media(max-width:700px){.app{padding:9px}.screen{padding:12px;border-radius:18px}.levels{gap:7px}.level{min-height:82px;font-size:17px;padding:8px}.level small{font-size:12px}.tabs{gap:6px}.tabbtn{flex:1;padding:8px 6px;font-size:15px}.intro{grid-template-columns:1fr}.formula,.formula-list,.choices{grid-template-columns:1fr}.figure{min-height:260px}.figure svg{height:250px}.prompt{font-size:18px}.choice{min-height:62px}.brand p{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><img id="head" class="navi" alt="ナビキャラ"><div><h1>公式仕分けくん</h1><p>図形を見て、公式をえらぼう！</p></div></div><b id="count">0 / 10</b></header>
<main class="screen">
<section id="home">
<div class="levels"><button class="level active" data-l="1">レベル1<small>基本の平面</small></button><button class="level" data-l="2">レベル2<small>平面 ＋ 立体</small></button><button class="level" data-l="3">レベル3<small>ごちゃまぜ ＋ 逆算</small></button></div>
<div class="tabs"><button id="studyBtn" class="tabbtn active">📖 公式集</button><button id="quizBtn" class="tabbtn">🎯 公式仕分け</button></div>
<div id="study" class="panel on"><div class="card"><h2 id="studyTitle"></h2><p id="studyDesc"></p><div id="studyList" class="formula-list"></div><div id="studyTip" class="tip"></div></div></div>
<div id="quizHome" class="panel"><div class="intro"><div class="card"><h2 id="title"></h2><p id="desc"></p><div id="formula" class="formula"></div><button id="start" class="main">このレベルをはじめる</button></div><div style="text-align:center"><img id="homeNavi" class="navi" style="width:200px;height:200px" alt="ナビキャラ"></div></div></div>
</section>
<section id="quiz" class="panel"><div class="quiz-top"><b id="qn"></b><button id="homeBtn" class="back">レベル選択へ</button></div><div id="figure" class="figure"></div><div id="figureCaption" class="figure-caption"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="next-wrap"><button id="nextBtn" class="next-btn">次の問題へ →</button></div></section>
<section id="result" class="panel result"><img id="resultNavi" class="navi" alt="ナビキャラ"><h2 id="resultTitle"></h2><p id="resultText"></p><img id="badge" class="badge" alt="図形バッジ"><button id="retry" class="main">もう一度挑戦</button><button id="resultHome" class="back">レベル選択へ</button></section>
</main></div>
<script>
const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';
const B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp';
const $=s=>document.querySelector(s);
const D={'長方形':'たて × 横','正方形':'一辺 × 一辺','平行四辺形':'底辺 × 高さ','三角形':'底辺 × 高さ ÷ 2','台形':'(上底 ＋ 下底) × 高さ ÷ 2','ひし形':'対角線 × 対角線 ÷ 2','円':'半径 × 半径 × 3.14','円周':'直径 × 3.14','立方体':'一辺 × 一辺 × 一辺','直方体':'たて × 横 × 高さ','角柱':'底面積 × 高さ','円柱':'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};
const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};
const INFO={1:['レベル1：基本の平面公式','まずは平面図形の公式を覚えよう。','saku'],2:['レベル2：平面＋立体公式','平面図形に立体の体積公式を加えよう。','kai'],3:['レベル3：ごちゃまぜ＋逆算','公式を逆向きに使う問題にも挑戦。','riku']};
const GROUPS=[['平面図形',['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周']],['立体の体積',['立方体','直方体','角柱','円柱']],['逆算（レベル3）',['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ']]];
let L=1,Q=[],i=0,score=0,answered=false;
function nav(p){const u=N+INFO[L][2]+'/fullbody/'+p+'.webp';['#head','#homeNavi'].forEach(s=>{const e=$(s);if(e)e.src=u});}
function renderStudy(){const x=INFO[L];$('#studyTitle').textContent=x[0]+'：公式集';$('#studyDesc').textContent=x[1];$('#studyList').innerHTML=GROUPS.map(([name,ks])=>{const list=ks.filter(k=>G[L].includes(k));if(!list.length)return '';return `<div class="formula-group"><h3>${name}</h3>${list.map(k=>`<div class="formula-row"><span class="formula-name">${k}</span><span class="formula-eq">${D[k]}</span></div>`).join('')}</div>`}).join('');$('#studyTip').textContent=L===3?'逆算は「もとの公式から、求めたいものだけを残す」と考えよう。':L===2?'立体の体積は「底面積 × 高さ」が基本。角柱も円柱も同じ考え方！':'図形の名前と、求めるもの（面積・円周・体積など）をセットで覚えよう。';}
function renderHome(){const x=INFO[L];$('#title').textContent=x[0];$('#desc').textContent=x[1];$('#formula').innerHTML=G[L].map(k=>`<div class="chip"><b>${k}</b><br>${D[k]}</div>`).join('');nav('waving');renderStudy();}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function svgWrap(body){return `<svg viewBox="0 0 620 315" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`}
function dim(x1,y1,x2,y2,text,cls=''){const mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="${cls==='h'?'dimh':'dim'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="${cls==='h'?'dimtext dimhtext':'dimtext'}" x="${mx}" y="${my-8}" text-anchor="middle">${text}</text>`}
function plane(t){let s='';if(t==='長方形')s=`<rect x="120" y="60" width="350" height="160" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(120,255,470,255,'8 cm')}${dim(95,60,95,220,'5 cm')}`;else if(t==='正方形')s=`<rect x="180" y="40" width="220" height="220" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(180,285,400,285,'6 cm')}`;else if(t==='平行四辺形')s=`<polygon points="150,65 500,65 445,220 95,220" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(95,255,445,255,'8 cm')}${dim(475,65,420,220,'5 cm','h')}`;else if(t==='三角形')s=`<polygon points="95,225 505,225 300,45" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="300" y1="45" x2="300" y2="225" class="dimh"/><text x="318" y="145" class="dimtext dimhtext">5 cm</text>${dim(95,260,505,260,'8 cm')}`;else if(t==='台形')s=`<polygon points="190,55 410,55 520,225 80,225" fill="#dff4ff" stroke="#36516a" stroke-width="4"/>${dim(190,35,410,35,'4 cm')}${dim(80,260,520,260,'9 cm')}${dim(160,55,160,225,'5 cm','h')}`;else if(t==='ひし形')s=`<polygon points="310,35 510,145 310,255 110,145" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="110" y1="145" x2="510" y2="145" class="dim"/><line x1="310" y1="35" x2="310" y2="255" class="dim"/><text x="310" y="137" class="dimtext" text-anchor="middle">8 cm</text><text x="330" y="92" class="dimtext" >6 cm</text>`;else if(t==='円')s=`<circle cx="310" cy="145" r="105" fill="#eadfff" stroke="#36516a" stroke-width="4"/><line x1="310" y1="145" x2="415" y2="145" class="dimh"/><text x="365" y="135" class="dimtext dimhtext">半径 5 cm</text>`;else s=`<circle cx="310" cy="145" r="105" fill="#eadfff" stroke="#36516a" stroke-width="4"/><line x1="205" y1="145" x2="415" y2="145" class="dim"/><text x="310" y="135" class="dimtext" text-anchor="middle">直径 10 cm</text>`;return svgWrap(s)}
function solid(t){if(t==='立方体')return svgWrap(`<polygon points="170,105 340,55 500,110 330,165" fill="#dff4ff" class="solid-face"/><polygon points="170,105 330,165 330,285 170,225" fill="#ccefff" class="solid-face"/><polygon points="330,165 500,110 500,230 330,285" fill="#bfe8ff" class="solid-face"/>${dim(170,245,330,305,'6 cm')}${dim(330,165,330,285,'6 cm','h')}`);if(t==='直方体')return svgWrap(`<polygon points="110,105 355,55 520,110 275,160" fill="#dff4ff" class="solid-face"/><polygon points="110,105 275,160 275,285 110,230" fill="#ccefff" class="solid-face"/><polygon points="275,160 520,110 520,235 275,285" fill="#bfe8ff" class="solid-face"/>${dim(110,250,275,305,'8 cm')}${dim(275,160,275,285,'5 cm','h')}${dim(390,70,505,108,'3 cm')}`);if(t==='円柱')return svgWrap(`<ellipse cx="310" cy="75" rx="125" ry="42" fill="#dff4ff" class="solid-face"/><path d="M185 75v170c0 23 56 42 125 42s125-19 125-42V75" fill="#ccefff" class="solid-face"/><ellipse cx="310" cy="245" rx="125" ry="42" fill="#bfe8ff" class="solid-face"/>${dim(310,75,435,75,'直径 8 cm')}${dim(435,75,435,245,'10 cm','h')}`);return svgWrap(`<polygon points="125,125 300,70 495,125 320,180" fill="#dff4ff" class="solid-face"/><polygon points="125,125 320,180 320,285 125,230" fill="#ccefff" class="solid-face"/><polygon points="320,180 495,125 495,230 320,285" fill="#bfe8ff" class="solid-face"/><text x="310" y="45" class="dimtext" text-anchor="middle">底面積を使って考える</text>${dim(320,180,320,285,'高さ','h')}`)}
function reverse(t){if(t==='三角形の高さ')return svgWrap(`<polygon points="95,225 505,225 300,45" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="300" y1="45" x2="300" y2="225" class="dimh"/><text x="325" y="145" class="dimtext dimhtext">高さ ?</text><text x="300" y="270" class="dimtext" text-anchor="middle">底辺 8 cm　・　面積 20 cm²</text>`);if(t==='平行四辺形の高さ')return svgWrap(`<polygon points="145,65 500,65 445,225 90,225" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><line x1="475" y1="65" x2="420" y2="225" class="dimh"/><text x="445" y="150" class="dimtext dimhtext">高さ ?</text><text x="310" y="270" class="dimtext" text-anchor="middle">底辺 10 cm　・　面積 50 cm²</text>`);if(t==='長方形の横')return svgWrap(`<rect x="130" y="65" width="360" height="155" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><text x="310" y="255" class="dimtext" text-anchor="middle">面積 40 cm²　・　たて 5 cm　・　横 ?</text>`);return svgWrap(`<rect x="130" y="75" width="360" height="145" fill="#dff4ff" stroke="#36516a" stroke-width="4"/><text x="310" y="255" class="dimtext" text-anchor="middle">体積 120 cm³　・　たて 4 cm　・　横 5 cm　・　高さ ?</text>`)}
function figure(t){if(['立方体','直方体','角柱','円柱'].includes(t))return solid(t);if(['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ'].includes(t))return reverse(t);return plane(t)}
function concept(t){if(['長方形','正方形','平行四辺形','三角形','台形','ひし形','円'].includes(t))return '面積';if(t==='円周')return '円周';if(['立方体','直方体','角柱','円柱'].includes(t))return '体積';return '逆算・求める長さ'}
function label(t){if(t==='長方形')return '長方形';if(t==='正方形')return '正方形';if(t==='平行四辺形')return '平行四辺形';if(t==='三角形')return '三角形';if(t==='台形')return '台形';if(t==='ひし形')return 'ひし形';if(t==='円')return '円';if(t==='円周')return '円';if(t==='立方体')return '立方体';if(t==='直方体')return '直方体';if(t==='角柱')return '角柱';if(t==='円柱')return '円柱';return t.replace('の高さ','').replace('の横','')}
function showPanel(id){['study','quizHome','quiz','result'].forEach(x=>$(x).classList.remove('on'));$(id).classList.add('on')}
function start(){Q=shuffle(G[L]).slice(0,10);i=0;score=0;showPanel('quiz');nextQuestion()}
function nextQuestion(){answered=false;$('#nextBtn').classList.remove('show');$('#feedback').textContent='';if(i>=Q.length){finish();return}const k=Q[i];$('#qn').textContent=`第 ${i+1} 問 / 10`;$('#count').textContent=`${i} / 10`;$('#figure').innerHTML=figure(k);$('#figureCaption').innerHTML=`<span class="tag">図形：${label(k)}</span><span class="tag">求めるもの：${concept(k)}</span>`;$('#prompt').textContent=L===3&&k.includes('の')?`「${k}」を求める公式は？`:`${label(k)}の${concept(k)}の公式はどれ？`;const wrong=shuffle(G[L].filter(x=>x!==k)).slice(0,3);$('#choices').innerHTML=shuffle([k,...wrong]).map(x=>`<button class="choice" data-k="${x}">${D[x]}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,k));}
function answer(btn,k){if(answered)return;answered=true;const ok=btn.dataset.k===k;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');if(!ok){const c=[...document.querySelectorAll('.choice')].find(b=>b.dataset.k===k);if(c)c.classList.add('correct')}else score++;$('#feedback').textContent=ok?'○ 正解！':'× 正解は「'+D[k]+'」';$('#nextBtn').classList.add('show');}
function finish(){localStorage.setItem(`kousiki-best-${L}`,Math.max(score,Number(localStorage.getItem(`kousiki-best-${L}`)||0)));$('#count').textContent='10 / 10';showPanel('result');const n=$('#resultNavi');n.src=N+INFO[L][2]+'/fullbody/celebrate.webp';$('#resultTitle').textContent=score===10?'パーフェクト！':`${score} / 10 正解！`;$('#resultText').textContent=score===10?'公式をしっかり見分けられたね！':`公式集を確認して、もう一度挑戦してみよう。ベスト記録：${localStorage.getItem(`kousiki-best-${L}`)} / 10`;$ ('#badge').src=B;$('#badge').classList.toggle('unlocked',score===10)}
function home(){showPanel('study');$('#studyBtn').classList.add('active');$('#quizBtn').classList.remove('active');$('#count').textContent='0 / 10';renderHome()}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{L=Number(b.dataset.l);document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderHome()});
$('#studyBtn').onclick=()=>{showPanel('study');$('#studyBtn').classList.add('active');$('#quizBtn').classList.remove('active')};
$('#quizBtn').onclick=()=>{showPanel('quizHome');$('#quizBtn').classList.add('active');$('#studyBtn').classList.remove('active');nav('waving')};
$('#start').onclick=start;$('#nextBtn').onclick=()=>{i++;nextQuestion()};$('#homeBtn').onclick=home;$('#retry').onclick=start;$('#resultHome').onclick=home;renderHome();
</script>
</body></html>
