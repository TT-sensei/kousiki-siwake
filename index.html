<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式仕分けくん</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css">
<style>
:root{--ink:#263238;--blue:#4f7cff;--line:#dce8f5}
*{box-sizing:border-box}body{margin:0;background:#f4f9ff;font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink)}
.app{max-width:1000px;margin:auto;padding:16px}.top,.brand{display:flex;gap:10px}.top{justify-content:space-between;align-items:center}.brand{align-items:center}.navi{width:70px;height:70px;object-fit:contain}
.screen{background:white;border-radius:22px;padding:20px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.level,.choice,.main{min-height:60px;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:700;cursor:pointer}.level.active{border-color:var(--blue);background:#eef4ff}.level small{display:block;font-weight:400;color:#718096}
.intro{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}.card{background:#f7fbff;border-radius:18px;padding:20px}.formula{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chip{padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}.main{width:100%;margin-top:16px;background:var(--blue);color:#fff;border:0}
.quiz,.result{display:none}.quiz.on,.result.on{display:block}.figure{min-height:270px;border:2px dashed #c9d9ea;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:14px 0;background:#fbfdff;overflow:hidden}.figure svg{width:min(100%,430px);height:260px}.prompt{text-align:center;font-size:20px;font-weight:800;margin:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:12px}.choice:disabled{cursor:default}.feedback{text-align:center;min-height:35px;font-weight:800}.badge{width:110px;height:110px;opacity:.3;filter:grayscale(1)}.badge.unlocked{opacity:1;filter:none}.center{text-align:center}.back{border:0;background:none;color:#60758c;margin-top:10px}
.shape-stroke{stroke:#36516a;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.shape-fill{fill:#dff4ff}.base-fill{fill:#ffe0dc}.solid-face{fill:#dff4ff;stroke:#36516a;stroke-width:3;stroke-linejoin:round}.solid-base{fill:#ffd8d2;stroke:#36516a;stroke-width:3}.hidden-edge{stroke:#91a6b8;stroke-dasharray:7 6;fill:none}.dim{stroke:#526b80;stroke-width:2}.dim-text{font-size:16px;font-weight:700;fill:#263238;stroke:none}.height-dim{stroke:#4f7cff}.height-text{fill:#315fd8}
@media(max-width:700px){.intro{grid-template-columns:1fr}.levels,.formula,.choices{grid-template-columns:1fr}.screen{padding:12px}.figure{min-height:245px}.figure svg{height:235px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><img id="head" class="navi" alt="ナビキャラ"><div><h1>公式仕分けくん</h1><div>図形を見て、公式をえらぼう！</div></div></div><b id="count">0 / 10</b></header>
<main class="screen">
<section id="home">
<div class="levels"><button class="level active" data-l="1">レベル1<small>基本の平面</small></button><button class="level" data-l="2">レベル2<small>平面＋立体</small></button><button class="level" data-l="3">レベル3<small>ごちゃまぜ＋逆算</small></button></div>
<div class="intro"><div class="card"><h2 id="title"></h2><p id="desc"></p><div id="formula" class="formula"></div><button id="start" class="main">このレベルをはじめる</button></div><div class="center"><img id="homeNavi" class="navi" style="width:180px;height:180px" alt="ナビキャラ"></div></div>
</section>
<section id="quiz" class="quiz"><div><b id="qn"></b><button id="homeBtn" class="back">レベル選択へ</button></div><div id="figure" class="figure"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="result center"><img id="resultNavi" class="navi" alt="ナビキャラ"><h2 id="resultTitle"></h2><p id="resultText"></p><img id="badge" class="badge" alt="図形バッジ"><button id="retry" class="main">もう一度挑戦</button><button id="resultHome" class="back">レベル選択へ</button></section>
</main></div>
<script type="module">
import{EDU_EVENTS}from'https://tt-sensei.github.io/edu-components/index.js';
const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/';
const B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp';
const $=s=>document.querySelector(s);
const D={
 '長方形':'たて × 横','正方形':'一辺 × 一辺','平行四辺形':'底辺 × 高さ','三角形':'底辺 × 高さ ÷ 2','台形':'(上底＋下底) × 高さ ÷ 2','ひし形':'対角線 × 対角線 ÷ 2','円':'半径 × 半径 × 3.14','円周':'直径 × 3.14','立方体':'一辺 × 一辺 × 一辺','直方体':'たて × 横 × 高さ','角柱':'底面積 × 高さ','円柱':'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};
const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};
const I={1:['レベル1：基本の平面公式','基本の平面図形を、形と公式をセットで見分けよう。','saku'],2:['レベル2：平面＋立体公式','平面図形に立体の体積公式を加えて見分けよう。','kai'],3:['レベル3：ごちゃまぜ＋逆算','平面・立体に、逆向きに考える公式も加えて挑戦。','riku']};
let L=1,Q=[],i=0,score=0;
function nav(p){let u=N+I[L][2]+'/fullbody/'+p+'.webp';$('#head').src=u;$('#homeNavi').src=u;$('#resultNavi').src=u}
function render(){let x=I[L];$('#title').textContent=x[0];$('#desc').textContent=x[1];$('#formula').innerHTML=G[L].slice(0,L===1?8:L===2?12:16).map(k=>`<div class="chip">${k}：${D[k]}</div>`).join('');nav('waving')}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function dim(x1,y1,x2,y2,text,cls=''){let mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="dim ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="dim-text ${cls?'height-text':''}" x="${mx}" y="${my-7}" text-anchor="middle">${text}</text>`}
function plane(type){
 let s=`<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg">`;
 if(type==='長方形')s+=`<rect class="shape-fill shape-stroke" x="90" y="55" width="240" height="120"/>${dim(90,195,330,195,'8 cm')}${dim(70,55,70,175,'5 cm')}`;
 else if(type==='正方形')s+=`<rect class="shape-fill shape-stroke" x="120" y="35" width="180" height="180"/>${dim(120,230,300,230,'6 cm')}${dim(105,35,105,215,'6 cm')}`;
 else if(type==='平行四辺形')s+=`<polygon class="shape-fill shape-stroke" points="105,55 325,55 285,180 65,180"/>${dim(65,200,285,200,'8 cm')}${dim(305,55,265,180,'5 cm','h')}`;
 else if(type==='三角形')s+=`<polygon class="shape-fill shape-stroke" points="80,180 340,180 210,45"/><line class="dim" x1="210" y1="45" x2="210" y2="180"/><text class="dim-text height-text" x="225" y="118">5 cm</text>${dim(80,200,340,200,'8 cm')}`;
 else if(type==='台形')s+=`<polygon class="shape-fill shape-stroke" points="135,55 285,55 345,180 75,180"/>${dim(135,38,285,38,'4 cm')}${dim(75,205,345,205,'9 cm')}<line class="dim" x1="120" y1="55" x2="120" y2="180"/><text class="dim-text height-text" x="135" y="123">5 cm</text>`;
 else if(type==='ひし形')s+=`<polygon class="shape-fill shape-stroke" points="210,35 335,125 210,215 85,125"/><line class="dim" x1="85" y1="125" x2="335" y2="125"/><line class="dim" x1="210" y1="35" x2="210" y2="215"/><text class="dim-text" x="210" y="118" text-anchor="middle">8 cm</text><text class="dim-text height-text" x="225" y="85">6 cm</text>`;
 else if(type==='円')s+=`<circle class="shape-fill shape-stroke" cx="210" cy="125" r="85"/><line class="dim" x1="210" y1="125" x2="295" y2="125"/><text class="dim-text height-text" x="252" y="115">5 cm</text>`;
 else if(type==='円周')s+=`<circle class="shape-fill shape-stroke" cx="210" cy="125" r="85"/><line class="dim" x1="125" y1="125" x2="295" y2="125"/><text class="dim-text" x="210" y="115" text-anchor="middle">直径 10 cm</text>`;
 return s+`</svg>`;
}
function prism(type){
 const circle=type==='円柱';
 if(type==='立方体')return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><polygon class="solid-face" points="110,75 255,75 325,115 180,115"/><polygon class="solid-face" points="110,75 180,115 180,205 110,165"/><polygon class="solid-face" points="180,115 325,115 325,205 180,205"/>${dim(180,220,325,220,'6 cm')}${dim(345,115,345,205,'6 cm','h')}</svg>`;
 if(type==='直方体')return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><polygon class="solid-face" points="80,80 270,80 335,120 145,120"/><polygon class="solid-face" points="80,80 145,120 145,205 80,165"/><polygon class="solid-face" points="145,120 335,120 335,205 145,205"/><line class="hidden-edge" x1="80" y1="165" x2="145" y2="205"/>${dim(145,220,335,220,'8 cm')}${dim(60,80,60,165,'5 cm','h')}<text class="dim-text" x="105" y="112">3 cm</text></svg>`;
 if(circle)return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><ellipse class="solid-base" cx="210" cy="72" rx="80" ry="28"/><path class="solid-face" d="M130 72 L130 180 Q210 208 290 180 L290 72 Q210 100 130 72Z"/><ellipse class="solid-base" cx="210" cy="180" rx="80" ry="28"/>${dim(130,45,290,45,'直径 8 cm')}${dim(315,72,315,180,'高さ 10 cm','h')}</svg>`;
 return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><polygon class="solid-base" points="120,75 245,75 315,115 190,115"/><polygon class="solid-face" points="120,75 190,115 190,205 120,165"/><polygon class="solid-face" points="190,115 315,115 315,205 190,205"/><line class="hidden-edge" x1="120" y1="165" x2="190" y2="205"/>${dim(190,220,315,220,'底面の辺')}${dim(335,115,335,205,'高さ','h')}<text class="dim-text" x="205" y="103">底面</text></svg>`;
}
function reverseFigure(type){
 if(type==='三角形の高さ')return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><polygon class="shape-fill shape-stroke" points="80,185 340,185 210,50"/><line class="dim" x1="210" y1="50" x2="210" y2="185"/><text class="dim-text height-text" x="225" y="120">高さ ?</text><text class="dim-text" x="210" y="208" text-anchor="middle">底辺 8 cm　面積 20 cm²</text></svg>`;
 if(type==='平行四辺形の高さ')return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><polygon class="shape-fill shape-stroke" points="95,60 335,60 285,180 45,180"/><line class="dim" x1="285" y1="60" x2="285" y2="180"/><text class="dim-text height-text" x="300" y="125">高さ ?</text><text class="dim-text" x="210" y="208" text-anchor="middle">底辺 8 cm　面積 40 cm²</text></svg>`;
 if(type==='長方形の横')return `<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg"><rect class="shape-fill shape-stroke" x="100" y="55" width="230" height="120"/><text class="dim-text" x="215" y="48" text-anchor="middle">たて 5 cm</text><text class="dim-text height-text" x="215" y="205" text-anchor="middle">横 ?　面積 40 cm²</text></svg>`;
 return prism('直方体');
}
function draw(type){if(['立方体','直方体','角柱','円柱'].includes(type))return prism(type);if(['三角形の高さ','平行四辺形の高さ','長方形の横','直方体の高さ'].includes(type))return reverseFigure(type);return plane(type)}
function start(){Q=shuffle(G[L]).slice(0,10);i=0;score=0;$('#home').style.display='none';$('#result').classList.remove('on');$('#quiz').classList.add('on');show()}
function show(){let k=Q[i],wrong=shuffle(Object.values(D).filter(v=>v!==D[k])).slice(0,3),opts=shuffle([D[k],...wrong]);$('#qn').textContent=`${i+1} / ${Q.length}`;$('#count').textContent=`${score} / ${Q.length}`;$('#figure').innerHTML=draw(k);$('#prompt').textContent=`「${k}」の公式はどれ？`;$('#choices').innerHTML='';$('#feedback').textContent='';opts.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(v===D[k],b,D[k]);$('#choices').appendChild(b)})}
function answer(ok,b,c){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(ok?'effect-correct-ring':'effect-wrong-shake');$('#feedback').textContent=ok?'○ 正解！':`△ 正解は「${c}」`;window.dispatchEvent(new CustomEvent(ok?EDU_EVENTS.CORRECT:EDU_EVENTS.WRONG,{detail:{isCorrect:ok,correct:c,question:Q[i]}}));if(ok)score++;setTimeout(()=>{i++;i<Q.length?show():finish()},650)}
function finish(){let got=score===Q.length;$('#quiz').classList.remove('on');$('#result').classList.add('on');$('#resultTitle').textContent=got?'公式マスター！':'よくがんばった！';$('#resultText').textContent=`${Q.length}問中 ${score}問正解`;$('#badge').src=B;$('#badge').classList.toggle('unlocked',got);nav(got?'complete':'retry');window.dispatchEvent(new CustomEvent(got?EDU_EVENTS.BADGE:EDU_EVENTS.COMPLETE,{detail:{score,level:L}}));localStorage.setItem('kousiki-siwake-best-'+L,Math.max(score,+(localStorage.getItem('kousiki-siwake-best-'+L)||0)))}
function home(){$('#quiz').classList.remove('on');$('#result').classList.remove('on');$('#home').style.display='block';render()}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');L=+b.dataset.l;render()});$('#start').onclick=start;$('#retry').onclick=start;$('#homeBtn').onclick=home;$('#resultHome').onclick=home;render();
</script>
</body></html>
