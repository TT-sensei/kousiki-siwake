<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式仕分けくん</title><link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css"><link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css"><link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css"><style>body{margin:0;background:#f4f9ff;font-family:system-ui,"Noto Sans JP",sans-serif;color:#263238}.app{max-width:1000px;margin:auto;padding:16px}.top,.brand,.levels,.choices{display:flex;gap:10px}.top{justify-content:space-between;align-items:center}.brand{align-items:center}.navi{width:70px;height:70px;object-fit:contain}.screen{background:white;border-radius:22px;padding:20px}.levels{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px}.level,.choice,.main{min-height:60px;border:2px solid #dce8f5;border-radius:15px;background:#fff;font-weight:700;cursor:pointer}.level.active{border-color:#4f7cff;background:#eef4ff}.level small{display:block;font-weight:400;color:#718096}.intro{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}.card{background:#f7fbff;border-radius:18px;padding:20px}.formula{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chip{padding:10px;background:#fff;border:1px solid #dce8f5;border-radius:10px}.main{width:100%;margin-top:16px;background:#4f7cff;color:#fff;border:0}.quiz,.result{display:none}.quiz.on,.result.on{display:block}.figure{height:230px;border:2px dashed #c9d9ea;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:14px 0}.figure svg{width:330px;height:210px}.prompt{text-align:center;font-size:20px;font-weight:800;margin:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr)}.choice{padding:12px}.feedback{text-align:center;min-height:35px;font-weight:800}.badge{width:110px;height:110px;opacity:.3;filter:grayscale(1)}.badge.unlocked{opacity:1;filter:none}.center{text-align:center}.back{border:0;background:none;color:#60758c;margin-top:10px}@media(max-width:700px){.intro{grid-template-columns:1fr}.levels,.formula,.choices{grid-template-columns:1fr}.screen{padding:12px}}</style></head><body><div class="app"><header class="top"><div class="brand"><img id="head" class="navi"><div><h1>公式仕分けくん</h1><div>図形を見て、公式をえらぼう！</div></div></div><b id="count">0 / 10</b></header><main class="screen"><section id="home"><div class="levels"><button class="level active" data-l="1">レベル1<small>基本の平面</small></button><button class="level" data-l="2">レベル2<small>平面＋立体</small></button><button class="level" data-l="3">レベル3<small>ごちゃまぜ＋逆算</small></button></div><div class="intro"><div class="card"><h2 id="title"></h2><p id="desc"></p><div id="formula" class="formula"></div><button id="start" class="main">このレベルをはじめる</button></div><div class="center"><img id="homeNavi" class="navi" style="width:180px;height:180px"></div></div></section><section id="quiz" class="quiz"><div><b id="qn"></b><button id="homeBtn" class="back">レベル選択へ</button></div><div id="figure" class="figure"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></section><section id="result" class="result center"><img id="resultNavi" class="navi"><h2 id="resultTitle"></h2><p id="resultText"></p><img id="badge" class="badge"><button id="retry" class="main">もう一度挑戦</button><button id="resultHome" class="back">レベル選択へ</button></section></main></div><script type="module">import{EDU_EVENTS}from'https://tt-sensei.github.io/edu-components/index.js';const N='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/',B='https://raw.githubusercontent.com/TT-sensei/edu-assets/main/assets/web/badges/math/geometry/badge.webp',$=s=>document.querySelector(s);const D={長方形:'たて × 横',正方形:'一辺 × 一辺',平行四辺形:'底辺 × 高さ',三角形:'底辺 × 高さ ÷ 2',台形:'(上底＋下底) × 高さ ÷ 2',ひし形:'対角線 × 対角線 ÷ 2',円:'半径 × 半径 × 3.14',円周:'直径 × 3.14',立方体:'一辺 × 一辺 × 一辺',直方体:'たて × 横 × 高さ',角柱:'底面積 × 高さ',円柱:'底面積 × 高さ','三角形の高さ':'面積 × 2 ÷ 底辺','平行四辺形の高さ':'面積 ÷ 底辺','長方形の横':'面積 ÷ たて','直方体の高さ':'体積 ÷ たて ÷ 横'};const G={1:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周'],2:['長方形','正方形','平行四辺形','三角形','台形','ひし形','円','円周','立方体','直方体','角柱','円柱'],3:Object.keys(D)};const I={1:['レベル1：基本の平面公式','基本の平面図形の公式を見分けよう。','saku'],2:['レベル2：平面＋立体公式','平面に立体の体積公式を加えよう。','kai'],3:['レベル3：ごちゃまぜ＋逆算','平面・立体＋逆向きの公式に挑戦。','riku']};let L=1,Q=[],i=0,score=0;function nav(p){let u=N+I[L][2]+'/fullbody/'+p+'.webp';$('#head').src=u;$('#homeNavi').src=u;$('#resultNavi').src=u}function render(){let x=I[L];$('#title').textContent=x[0];$('#desc').textContent=x[1];$('#formula').innerHTML=G[L].slice(0,L===1?8:L===2?12:8).map(k=>`<div class="chip">${k}：${D[k]}</div>`).join('');nav('waving')}function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function start(){Q=shuffle(G[L]).slice(0,10);i=0;score=0;$('#home').style.display='none';$('#result').classList.remove('on');$('#quiz').classList.add('on');show()}function show(){let k=Q[i],opts=shuffle([D[k],...shuffle(Object.values(D).filter(v=>v!==D[k])).slice(0,3)]);$('#qn').textContent=`${i+1} / ${Q.length}`;$('#count').textContent=`${score} / ${Q.length}`;$('#figure').innerHTML='<svg viewBox="0 0 350 220" fill="none" stroke="#4f7cff" stroke-width="5"><rect x="70" y="50" width="210" height="120"/><text x="125" y="205" fill="#263238" stroke="none">'+k+'</text></svg>';$('#prompt').textContent=`「${k}」の公式はどれ？`;$(' #choices').innerHTML='';opts.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(v===D[k],b,D[k]);$('#choices').appendChild(b)})}function answer(ok,b,c){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(ok?'effect-correct-ring':'effect-wrong-shake');$('#feedback').textContent=ok?'○ 正解！':`△ 正解は「${c}」`;window.dispatchEvent(new CustomEvent(ok?EDU_EVENTS.CORRECT:EDU_EVENTS.WRONG,{detail:{isCorrect:ok,correct:c,question:Q[i]}}));if(ok)score++;setTimeout(()=>{i++;i<Q.length?show():finish()},600)}function finish(){let got=score===Q.length;$('#quiz').classList.remove('on');$('#result').classList.add('on');$('#resultTitle').textContent=got?'公式マスター！':'よくがんばった！';$('#resultText').textContent=`${Q.length}問中 ${score}問正解`;$('#badge').src=B;$('#badge').classList.toggle('unlocked',got);nav(got?'complete':'retry');window.dispatchEvent(new CustomEvent(got?EDU_EVENTS.BADGE:EDU_EVENTS.COMPLETE,{detail:{score,level:L}}));localStorage.setItem('kousiki-siwake-best-'+L,Math.max(score,+(localStorage.getItem('kousiki-siwake-best-'+L)||0)))}function home(){$('#quiz').classList.remove('on');$('#result').classList.remove('on');$('#home').style.display='block';render()}document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');L=+b.dataset.l;render()});$('#start').onclick=start;$('#retry').onclick=start;$('#homeBtn').onclick=home;$('#resultHome').onclick=home;render();</script></body></html>
